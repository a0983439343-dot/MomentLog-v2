<!doctype html>
<html lang="zh-Hant" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7fb">
<meta name="description" content="MomentLog - 一起記錄每個時刻">
<meta name="google" content="notranslate">
<link rel="manifest" href="./manifest.webmanifest">
<title>MomentLog</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color:#172033;
  background:var(--bg,linear-gradient(135deg,#eef2ff,#f8fafc));
  transition:.25s
}

button,input,textarea{
  font:inherit
}

button{
  cursor:pointer
}

button:disabled{
  opacity:.55;
  cursor:not-allowed
}

.hide{
  display:none!important
}

.app{
  width:min(1160px,100%);
  margin:auto;
  padding:16px
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:14px
}

.brand{
  display:flex;
  gap:10px;
  align-items:center
}

.icon{
  width:45px;
  height:45px;
  border-radius:14px;
  background:#111827;
  color:#fff;
  display:grid;
  place-items:center;
  font-size:22px
}

.brand h1{
  margin:0;
  font-size:21px
}

.brand small,
.muted{
  color:#718096
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:flex-end
}

.btn{
  border:1px solid #e6eaf0;
  background:#fff;
  color:#172033;
  border-radius:12px;
  padding:10px 13px;
  min-height:40px
}

.btn.primary{
  background:#4f46e5;
  color:#fff;
  border-color:#4f46e5
}

.btn.danger{
  background:#fee2e2;
  color:#dc2626;
  border-color:#fecaca
}

.btn.active{
  background:#dcfce7;
  color:#166534;
  border-color:#86efac
}

.card{
  background:rgba(255,255,255,.96);
  border-radius:20px;
  box-shadow:0 14px 38px rgba(15,23,42,.08)
}

.setup{
  max-width:540px;
  margin:8vh auto;
  padding:28px
}

.setup h2{
  margin:0 0 8px
}

.setup p{
  line-height:1.7;
  color:#718096
}

.field{
  margin:12px 0
}

.field label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:6px
}

.field input,
.field textarea{
  width:100%;
  padding:12px;
  border:1px solid #e6eaf0;
  border-radius:12px;
  background:#fff;
  outline:none
}

.field input:focus,
.field textarea:focus{
  border-color:#818cf8;
  box-shadow:0 0 0 3px rgba(99,102,241,.1)
}

.setupActions{
  display:grid;
  gap:8px;
  margin-top:14px
}

.googleBtn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  font-weight:700
}

.googleIcon{
  width:20px;
  height:20px
}

.account{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border:1px solid #e6eaf0;
  border-radius:13px;
  background:#f8fafc;
  margin-top:12px
}

.account img{
  width:38px;
  height:38px;
  border-radius:50%;
  object-fit:cover
}

.accountInfo{
  min-width:0;
  flex:1
}

.accountName{
  font-weight:800;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.accountEmail{
  font-size:12px;
  color:#718096;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.hero{
  padding:18px;
  margin-bottom:14px
}

.heroRow{
  display:flex;
  justify-content:space-between;
  gap:10px
}

.hero h2{
  margin:0;
  font-size:24px
}

.clock{
  font-size:25px;
  font-weight:800;
  text-align:right
}

.next{
  font-size:12px;
  color:#718096;
  text-align:right;
  margin-top:2px
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:14px
}

.stat{
  padding:12px;
  border:1px solid #e6eaf0;
  border-radius:13px;
  background:#fff
}

.statTitle{
  font-size:12px;
  color:#718096
}

.statValue{
  font-size:18px;
  font-weight:800;
  margin-top:4px;
  word-break:break-word
}

.grid{
  display:grid;
  grid-template-columns:280px 1fr;
  gap:14px
}

.side{
  padding:15px;
  position:sticky;
  top:12px
}

.sideTitle{
  font-weight:800;
  margin-bottom:10px
}

.members{
  display:grid;
  gap:8px
}

.member{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center;
  border:1px solid #e6eaf0;
  border-radius:12px;
  padding:9px;
  background:#fff
}

.memberName{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.ownerMark{
  font-size:11px;
  color:#4f46e5;
  font-weight:800;
  margin-left:4px
}

.badge{
  padding:5px 8px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap
}

.done{
  background:#dcfce7;
  color:#166534
}

.wait{
  background:#fef3c7;
  color:#92400e
}

.sideButtons{
  display:grid;
  gap:8px;
  margin-top:14px
}

.timeline{
  padding:16px
}

.timelineHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px
}

.timelineHead h3{
  margin:0
}

.slots{
  display:grid;
  gap:10px
}

.emptyTimeline{
  padding:25px 15px;
  text-align:center;
  color:#718096;
  border:1px dashed #d9dee8;
  border-radius:14px;
  background:#f8fafc
}

.slot{
  display:grid;
  grid-template-columns:60px 1fr;
  gap:8px
}

.time{
  font-size:12px;
  font-weight:800;
  color:#718096;
  text-align:right;
  padding-top:11px
}

.slotBox{
  border:1px solid #e6eaf0;
  border-radius:14px;
  padding:11px;
  background:#fff
}

.slotTitle{
  display:flex;
  justify-content:space-between;
  gap:8px
}

.pill{
  display:inline-flex;
  margin-top:8px;
  padding:6px 9px;
  border-radius:9px;
  font-size:12px;
  font-weight:800
}

.pill.now{
  background:#e0e7ff;
  color:#3730a3
}

.pill.done{
  background:#dcfce7;
  color:#166534
}

.caption{
  margin-top:8px;
  line-height:1.65;
  white-space:pre-wrap;
  word-break:break-word
}

.media{
  margin-top:9px;
  border-radius:11px;
  overflow:hidden;
  background:#111827
}

.media img,
.media video{
  display:block;
  width:100%;
  max-height:500px;
  object-fit:contain
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.56);
  display:none;
  align-items:center;
  justify-content:center;
  padding:12px;
  z-index:1000
}

.modal.show{
  display:flex
}

.modalCard{
  width:min(620px,100%);
  background:#fff;
  border-radius:20px;
  padding:17px;
  max-height:90vh;
  overflow:auto
}

.modalHead{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.close{
  width:38px;
  height:38px;
  border:1px solid #e6eaf0;
  border-radius:50%;
  background:#fff
}

.mediaBtns{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px
}

.hidden{
  display:none
}

.modalActions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:14px
}

.themeGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px
}

.themeOpt{
  border:2px solid #e6eaf0;
  background:#fff;
  border-radius:12px;
  padding:8px;
  text-align:left
}

.themeOpt.selected{
  border-color:#4f46e5
}

.swatch{
  height:48px;
  border-radius:9px;
  margin-bottom:6px
}

.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  z-index:2000;
  display:none;
  background:#111827;
  color:#fff;
  padding:10px 14px;
  border-radius:999px;
  font-size:13px;
  max-width:calc(100vw - 30px);
  text-align:center
}

.status{
  margin-top:12px;
  padding:10px;
  border-radius:12px;
  background:#f8fafc;
  font-size:13px
}

.loginNote{
  font-size:12px;
  line-height:1.6;
  color:#718096;
  margin-top:10px
}

@media(max-width:820px){
  .grid{
    grid-template-columns:1fr
  }

  .side{
    position:static
  }

  .heroRow{
    flex-direction:column
  }

  .clock,
  .next{
    text-align:left
  }
}

@media(max-width:580px){
  .stats{
    grid-template-columns:1fr 1fr
  }

  .mediaBtns{
    grid-template-columns:1fr 1fr
  }

  .themeGrid{
    grid-template-columns:1fr
  }

  .slot{
    grid-template-columns:52px 1fr
  }

  .modalActions{
    display:grid;
    grid-template-columns:1fr 1fr
  }
}
</style>
</head>

<body>
<div class="app">

<section id="setup" class="setup card">

  <div class="icon">⏱️</div>

  <h2>MomentLog</h2>

  <p>
    真正的多人雲端版：登入 Google 帳號後，
    建立房間或加入朋友的房間，一起記錄每個時刻。
  </p>

  <div id="loginArea">

    <button id="googleLogin" class="btn primary googleBtn">
      <span class="googleIcon">G</span>
      使用 Google 帳號登入
    </button>

    <div class="loginNote">
      Google 帳號只用來確認你的登入身分。
      MomentLog 不會把你的 Google 密碼交給網站。
    </div>

  </div>

  <div id="profileArea" class="hide">

    <div class="account">
      <img id="accountPhoto" src="" alt="">
      <div class="accountInfo">
        <div id="accountName" class="accountName"></div>
        <div id="accountEmail" class="accountEmail"></div>
      </div>
      <button id="logout" class="btn">登出</button>
    </div>

    <div class="field">
      <label for="name">你的暱稱</label>
      <input
        id="name"
        maxlength="30"
        placeholder="例如：小明"
        autocomplete="nickname"
        translate="no"
      >
    </div>

    <div class="field">
      <label for="log">Log 名稱</label>
      <input
        id="log"
        maxlength="60"
        placeholder="例如：我們的暑假"
        autocomplete="off"
        translate="no"
      >
    </div>

    <div class="setupActions">
      <button id="saveProfile" class="btn">
        保存個人資料
      </button>

      <button id="create" class="btn primary">
        建立新房間
      </button>
    </div>

    <hr style="border:0;border-top:1px solid #e6eaf0;margin:18px 0">

    <div class="field">
      <label for="joinCode">加入房間碼</label>
      <input
        id="joinCode"
        maxlength="12"
        placeholder="例如 ABCD1234"
        autocomplete="off"
        translate="no"
      >
    </div>

    <div class="setupActions">
      <button id="join" class="btn">
        加入房間
      </button>
    </div>

  </div>

  <div
    id="setupStatus"
    class="muted"
    style="font-size:13px;margin-top:10px"
  >
    正在連線…
  </div>

</section>


<section id="room" class="hide">

<header class="top">

  <div class="brand">
    <div class="icon">⏱️</div>

    <div>
      <h1>MomentLog</h1>
      <small>一起記錄每個時刻</small>
    </div>
  </div>

  <div class="actions">

    <button id="notify" class="btn">
      🔕 通知：關閉
    </button>

    <button id="theme" class="btn">
      🎨 主題
    </button>

    <button id="invite" class="btn">
      邀請
    </button>

    <button id="leave" class="btn danger">
      離開房間
    </button>

  </div>

</header>


<section class="hero card">

  <div class="heroRow">

    <div>
      <h2 id="title">MomentLog</h2>
      <div id="sub" class="muted"></div>
    </div>

    <div>
      <div id="clock" class="clock">
        00:00:00
      </div>

      <div id="next" class="next"></div>
    </div>

  </div>

  <div class="stats">

    <div class="stat">
      <div class="statTitle">已到時段</div>
      <div id="available" class="statValue">0</div>
    </div>

    <div class="stat">
      <div class="statTitle">今日已完成</div>
      <div id="doneCount" class="statValue">0</div>
    </div>

    <div class="stat">
      <div class="statTitle">房間碼</div>
      <div id="roomCode" class="statValue"></div>
    </div>

  </div>

</section>


<main class="grid">

<aside class="side card">

  <div class="sideTitle">
    房間成員
  </div>

  <div id="members" class="members"></div>

  <div class="sideButtons">

    <button id="now" class="btn primary">
      📍 記錄現在
    </button>

    <button id="yesterday" class="btn">
      查看昨天
    </button>

    <button id="today" class="btn hide">
      ↩ 返回今天
    </button>

  </div>

</aside>


<section class="timeline card">

  <div class="timelineHead">

    <div>
      <h3>時間軸</h3>

      <div
        id="dateLabel"
        class="muted"
        style="font-size:13px;margin-top:4px"
      ></div>
    </div>

  </div>

  <div id="slots" class="slots"></div>

</section>

</main>

</section>

</div>


<div id="recordModal" class="modal">

<div class="modalCard">

  <div class="modalHead">

    <div>
      <h3>記錄這個時刻</h3>
      <div id="recordWhen" class="muted"></div>
    </div>

    <button id="recordClose" class="close">
      ×
    </button>

  </div>

  <div class="field">

    <label for="caption">
      內容
    </label>

    <textarea
      id="caption"
      maxlength="3000"
      rows="6"
      placeholder="寫下這一刻發生了什麼…"
      translate="no"
    ></textarea>

  </div>

  <div class="mediaBtns">

    <button id="photo" class="btn">
      📷 拍照
    </button>

    <button id="video" class="btn">
      🎥 錄影
    </button>

    <button id="album" class="btn">
      🖼️ 相簿
    </button>

    <button id="remove" class="btn danger">
      🗑️ 移除媒體
    </button>

  </div>

  <input
    id="photoInput"
    class="hidden"
    type="file"
    accept="image/*"
    capture="environment"
  >

  <input
    id="videoInput"
    class="hidden"
    type="file"
    accept="video/*"
    capture="environment"
  >

  <input
    id="albumInput"
    class="hidden"
    type="file"
    accept="image/*,video/*"
  >

  <div id="preview"></div>

  <div id="uploadStatus" class="status hide"></div>

  <div class="modalActions">

    <button id="cancelRecord" class="btn">
      取消
    </button>

    <button id="saveRecord" class="btn primary">
      儲存
    </button>

  </div>

</div>

</div>


<div id="themeModal" class="modal">

<div class="modalCard">

  <div class="modalHead">

    <h3>🎨 背景主題</h3>

    <button id="themeClose" class="close">
      ×
    </button>

  </div>

  <div class="themeGrid">

    <button class="themeOpt" data-theme="default">
      <div
        class="swatch"
        style="background:linear-gradient(135deg,#eef2ff,#f8fafc)"
      ></div>
      🌤️ 預設
    </button>

    <button class="themeOpt" data-theme="blue">
      <div
        class="swatch"
        style="background:linear-gradient(135deg,#dbeafe,#eff6ff)"
      ></div>
      🌊 藍色
    </button>

    <button class="themeOpt" data-theme="green">
      <div
        class="swatch"
        style="background:linear-gradient(135deg,#dcfce7,#f0fdf4)"
      ></div>
      🌿 綠色
    </button>

    <button class="themeOpt" data-theme="pink">
      <div
        class="swatch"
        style="background:linear-gradient(135deg,#fce7f3,#fff1f2)"
      ></div>
      🌸 粉色
    </button>

    <button class="themeOpt" data-theme="purple">
      <div
        class="swatch"
        style="background:linear-gradient(135deg,#ede9fe,#f5f3ff)"
      ></div>
      💜 紫色
    </button>

    <button class="themeOpt" data-theme="sunset">
      <div
        class="swatch"
        style="background:linear-gradient(135deg,#ffedd5,#fef3c7)"
      ></div>
      🌅 日落
    </button>

    <button class="themeOpt" data-theme="dark">
      <div
        class="swatch"
        style="background:linear-gradient(135deg,#1e293b,#0f172a)"
      ></div>
      🌌 黑暗
    </button>

  </div>

</div>

</div>


<div id="toast" class="toast"></div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  get,
  set,
  update,
  remove,
  onValue,
  runTransaction
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";

import {
  getStorage,
  ref as storageRef,
  uploadBytes,
  getDownloadURL,
  deleteObject
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-storage.js";

import {
  getMessaging,
  getToken,
  isSupported,
  onMessage
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-messaging.js";

import firebaseConfig from "./firebase-config.js";


const VAPID_PUBLIC_KEY =
"BN4k0ivU8J1bzyVlUncMDqgJnQKpzO33wwOJW4PbKvjGBHhBlc74bo_LmRw6lfsjREcjqH5YUfmCBMegeMMr83c";


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getDatabase(app);

const storage=getStorage(app);

const googleProvider=new GoogleAuthProvider();

const $=id=>document.getElementById(id);


const themes={
  default:"linear-gradient(135deg,#eef2ff,#f8fafc)",
  blue:"linear-gradient(135deg,#dbeafe,#eff6ff)",
  green:"linear-gradient(135deg,#dcfce7,#f0fdf4)",
  pink:"linear-gradient(135deg,#fce7f3,#fff1f2)",
  purple:"linear-gradient(135deg,#ede9fe,#f5f3ff)",
  sunset:"linear-gradient(135deg,#ffedd5,#fef3c7)",
  dark:"linear-gradient(135deg,#1e293b,#0f172a)"
};


const pad=n=>String(n).padStart(2,"0");


const taipeiParts=date=>
  new Intl.DateTimeFormat(
    "zh-TW",
    {
      timeZone:"Asia/Taipei",
      year:"numeric",
      month:"2-digit",
      day:"2-digit",
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit",
      hourCycle:"h23"
    }
  )
  .formatToParts(date)
  .reduce(
    (o,p)=>{
      o[p.type]=p.value;
      return o;
    },
    {}
  );


const dateKey=d=>{
  const p=taipeiParts(d);

  return `${p.year}-${p.month}-${p.day}`;
};


const hourKey=h=>pad(h);


const isToday=d=>
  dateKey(d)===dateKey(new Date());


const addDays=(d,n)=>{
  const x=new Date(d);
  x.setDate(x.getDate()+n);
  return x;
};


const escapeHtml=s=>
  String(s??"")
  .replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );


const safeFileName=n=>
  String(n||"file")
  .replace(/[^a-zA-Z0-9._-]/g,"_")
  .slice(0,120);


const tokenKey=token=>{
  const bytes=new TextEncoder().encode(token);

  let s="";

  bytes.forEach(
    b=>s+=String.fromCharCode(b)
  );

  return btoa(s)
    .replace(/\+/g,"-")
    .replace(/\//g,"_")
    .replace(/=+$/,"");
};


let user=null;

let roomId=
  localStorage.getItem("momentlog_room")||"";

let room=null;

let selectedFile=null;

let activeHour=null;

let currentDate=new Date();

let unsubMeta=null;

let unsubMembers=null;

let unsubSettings=null;

let unsubRecords=null;

let messagingReady=false;

let renderTimer=null;


function toast(message){

  const t=$("toast");

  t.textContent=message;

  t.style.display="block";

  clearTimeout(window.__momentToast);

  window.__momentToast=
    setTimeout(
      ()=>{
        t.style.display="none";
      },
      2800
    );
}


function applyTheme(){

  const theme=
    localStorage.getItem("momentlog_theme")||
    "default";

  document.documentElement.style.setProperty(
    "--bg",
    themes[theme]||themes.default
  );

  document
    .querySelectorAll(".themeOpt")
    .forEach(
      b=>b.classList.toggle(
        "selected",
        b.dataset.theme===theme
      )
    );
}


function showSetupStatus(message){

  $("setupStatus").textContent=message;
}


function memberPath(uid,id=roomId){

  return `rooms/${id}/members/${uid}`;
}


function recordPath(
  d,
  h,
  uid,
  id=roomId
){

  return `rooms/${id}/records/${dateKey(d)}/${hourKey(h)}/${uid}`;
}


function clearListeners(){

  [
    unsubMeta,
    unsubMembers,
    unsubSettings,
    unsubRecords
  ]
  .forEach(
    fn=>{
      try{
        fn?.();
      }catch{}
    }
  );

  unsubMeta=null;
  unsubMembers=null;
  unsubSettings=null;
  unsubRecords=null;
}


function friendlyError(e){

  const code=e?.code||"";

  if(
    code.includes("permission-denied")||
    code.includes("PERMISSION_DENIED")
  ){
    return "Firebase 權限被拒絕，請檢查 Realtime Database Rules";
  }

  if(code.includes("storage/unauthorized")){
    return "Storage 權限被拒絕，請檢查 Storage Rules";
  }

  if(code.includes("storage/bucket-not-found")){
    return "Storage 尚未建立";
  }

  if(code.includes("storage/unknown")){
    return "Storage 尚未啟用或設定有問題";
  }

  if(code==="auth/popup-closed-by-user"){
    return "你關閉了 Google 登入視窗";
  }

  if(code==="auth/popup-blocked"){
    return "瀏覽器阻擋了登入視窗，請允許彈出視窗";
  }

  if(code==="auth/unauthorized-domain"){
    return "目前網站網域尚未加入 Firebase Authentication 授權網域";
  }

  if(code==="auth/operation-not-allowed"){
    return "Firebase 尚未啟用 Google 登入";
  }

  return e?.message||"未知錯誤";
}


function renderNotify(){

  const enabled=
    room?.myNotification?.enabled===true;

  const button=$("notify");

  button.textContent=
    enabled
      ?"🔔 通知：開啟"
      :"🔕 通知：關閉";

  button.classList.toggle(
    "active",
    enabled
  );
}


function isOwner(){

  return Boolean(
    user &&
    room?.meta?.ownerUid===user.uid
  );
}


function validateName(){

  const name=$("name").value.trim();

  if(!name){

    toast("請輸入暱稱");

    $("name").focus();

    return null;
  }

  if(name.length>30){

    toast("暱稱最多 30 個字");

    return null;
  }

  return name;
}


function validateLogName(){

  const log=$("log").value.trim();

  if(!log){

    toast("請輸入 Log 名稱");

    $("log").focus();

    return null;
  }

  if(log.length>60){

    toast("Log 名稱最多 60 個字");

    return null;
  }

  return log;
}


function renderLoginState(){

  const loggedIn=Boolean(user);

  $("loginArea")
    .classList.toggle(
      "hide",
      loggedIn
    );

  $("profileArea")
    .classList.toggle(
      "hide",
      !loggedIn
    );

  if(!loggedIn){

    $("accountPhoto").src="";

    $("accountName").textContent="";

    $("accountEmail").textContent="";

    $("name").value="";

    return;
  }

  const photo=user.photoURL||"";

  if(photo){

    $("accountPhoto").src=photo;

    $("accountPhoto").classList.remove("hide");

  }else{

    $("accountPhoto").classList.add("hide");

  }

  $("accountName").textContent=
    user.displayName||
    "Google 使用者";

  $("accountEmail").textContent=
    user.email||
    "已登入";

}


async function saveProfile(){

  if(!user){

    toast("請先登入 Google 帳號");

    return false;
  }

  const name=validateName();

  if(!name){
    return false;
  }

  try{

    const now=Date.now();

    await set(
      ref(db,`users/${user.uid}`),
      {
        displayName:name,
        updatedAt:now,
        createdAt:
          room?.profile?.createdAt||
          now
      }
    );

    localStorage.setItem(
      "momentlog_name",
      name
    );

    toast("個人資料已保存");

    return true;

  }catch(error){

    console.error(
      "saveProfile error:",
      error
    );

    toast(
      "保存個人資料失敗："+friendlyError(error)
    );

    return false;
  }
}


async function loadProfile(){

  if(!user)return;

  try{

    const snapshot=
      await get(
        ref(db,`users/${user.uid}`)
      );

    if(snapshot.exists()){

      const profile=snapshot.val();

      room=room||{};

      room.profile=profile;

      if(
        profile.displayName &&
        !$("name").value.trim()
      ){

        $("name").value=
          profile.displayName;

      }

      localStorage.setItem(
        "momentlog_name",
        profile.displayName||""
      );

    }else{

      const fallback=
        localStorage.getItem(
          "momentlog_name"
        )||"";

      if(fallback){

        $("name").value=fallback;

      }

    }

  }catch(error){

    console.error(
      "loadProfile error:",
      error
    );

    toast(
      "個人資料讀取失敗："+friendlyError(error)
    );
  }
}

async function logout(){

  if(
    roomId &&
    !confirm(
      "你目前還在房間中。\n確定要登出嗎？"
    )
  ){

    return;
  }

  try{

    clearListeners();

    room=null;

    roomId="";

    currentDate=new Date();

    localStorage.removeItem(
      "momentlog_room"
    );

    await signOut(auth);

    $("room").classList.add("hide");

    $("setup").classList.remove("hide");

    showSetupStatus(
      "已登出"
    );

    toast("已登出");

  }catch(error){

    console.error(
      "logout error:",
      error
    );

    toast(
      "登出失敗："+friendlyError(error)
    );
  }
}


async function createRoom(){

  if(!user){

    toast("請先登入 Google 帳號");

    return;
  }

  const name=validateName();

  if(!name)return;

  const log=validateLogName();

  if(!log)return;

  try{

    await saveProfile();

    let id="";

    for(
      let i=0;
      i<8&&!id;
      i++
    ){

      const candidate=
        crypto.randomUUID()
          .replace(/-/g,"")
          .slice(0,8)
          .toUpperCase();

      const tx=
        await runTransaction(
          ref(
            db,
            `rooms/${candidate}/meta`
          ),
          current=>
            current===null
              ?{
                roomId:candidate,
                name:log,
                ownerUid:user.uid,
                createdAt:Date.now(),
                updatedAt:Date.now()
              }
              :undefined
        );

      if(tx.committed){

        id=candidate;

      }

    }

    if(!id){

      throw new Error(
        "房間碼建立失敗，請再試一次"
      );
    }

    const now=Date.now();

    await set(
      ref(
        db,
        memberPath(user.uid,id)
      ),
      {
        displayName:name,
        joinedAt:now,
        updatedAt:now
      }
    );

    localStorage.setItem(
      "momentlog_room",
      id
    );

    localStorage.setItem(
      "momentlog_name",
      name
    );

    roomId=id;

    currentDate=new Date();

    connectRoom();

    toast(
      "房間建立成功"
    );

  }catch(error){

    console.error(
      "createRoom error:",
      error
    );

    toast(
      "建立房間失敗："+friendlyError(error)
    );
  }
}


async function joinRoom(){

  if(!user){

    toast("請先登入 Google 帳號");

    return;
  }

  const name=validateName();

  if(!name)return;

  const id=
    $("joinCode")
      .value
      .trim()
      .toUpperCase();

  if(!/^[A-Z0-9]{8,12}$/.test(id)){

    toast("房間碼格式不正確");

    return;
  }

  try{

    const metaSnapshot=
      await get(
        ref(db,`rooms/${id}/meta`)
      );

    if(!metaSnapshot.exists()){

      toast("找不到這個房間");

      return;
    }

    const meta=metaSnapshot.val();

    const now=Date.now();

    await set(
      ref(
        db,
        memberPath(user.uid,id)
      ),
      {
        displayName:name,
        joinedAt:now,
        updatedAt:now
      }
    );

    await set(
      ref(
        db,
        `users/${user.uid}`
      ),
      {
        displayName:name,
        updatedAt:now,
        createdAt:
          room?.profile?.createdAt||
          now
      }
    );

    localStorage.setItem(
      "momentlog_room",
      id
    );

    localStorage.setItem(
      "momentlog_name",
      name
    );

    roomId=id;

    currentDate=new Date();

    connectRoom();

    toast(
      `已加入「${meta.name||"MomentLog"}」`
    );

  }catch(error){

    console.error(
      "joinRoom error:",
      error
    );

    toast(
      "加入房間失敗："+friendlyError(error)
    );
  }
}


function connectRoom(){

  clearListeners();

  if(!roomId||!user)return;

  room=room||{};

  unsubMeta=
    onValue(
      ref(
        db,
        `rooms/${roomId}/meta`
      ),
      snapshot=>{

        if(!snapshot.exists()){

          toast(
            "房間不存在或已被刪除"
          );

          leaveLocal();

          return;
        }

        room=room||{};

        room.meta=
          snapshot.val()||{};

        render();

      },
      error=>{

        console.error(
          "meta listener error:",
          error
        );

        toast(
          "房間資料讀取失敗："+friendlyError(error)
        );

      }
    );


  unsubMembers=
    onValue(
      ref(
        db,
        `rooms/${roomId}/members`
      ),
      snapshot=>{

        room=room||{};

        room.members=
          snapshot.val()||{};

        render();

      },
      error=>{

        console.error(
          "members listener error:",
          error
        );

        toast(
          "成員資料讀取失敗："+friendlyError(error)
        );

      }
    );


  unsubSettings=
    onValue(
      ref(
        db,
        `rooms/${roomId}/notificationSettings/${user.uid}`
      ),
      snapshot=>{

        room=room||{};

        room.myNotification=
          snapshot.val()||{};

        renderNotify();

      },
      error=>{

        console.error(
          "notification listener error:",
          error
        );

      }
    );


  loadRecordsListener();

}


function loadRecordsListener(){

  if(unsubRecords){

    try{
      unsubRecords();
    }catch{}

    unsubRecords=null;
  }

  if(!roomId||!user)return;

  const targetDate=
    dateKey(currentDate);

  unsubRecords=
    onValue(
      ref(
        db,
        `rooms/${roomId}/records/${targetDate}`
      ),
      snapshot=>{

        room=room||{};

        room.records=
          snapshot.val()||{};

        render();

      },
      error=>{

        console.error(
          "records listener error:",
          error
        );

        toast(
          "紀錄讀取失敗："+friendlyError(error)
        );

      }
    );

}


function render(){

  if(!room?.meta)return;

  $("setup").classList.add("hide");

  $("room").classList.remove("hide");

  $("title").textContent=
    room.meta.name||
    "MomentLog";

  $("roomCode").textContent=
    roomId;

  $("sub").textContent=
    `${dateKey(currentDate)} · 房間碼 ${roomId}`;

  const now=new Date();

  const p=taipeiParts(now);

  $("clock").textContent=
    `${p.hour}:${p.minute}:${p.second}`;


  const all=
    room.records||{};

  const entries=[];


  /*
   * 今天：
   * 不顯示目前小時。
   *
   * 例如現在 21:00：
   * 顯示 00:00 ~ 20:00。
   *
   * 歷史日期：
   * 顯示完整 00:00 ~ 23:00。
   */

  let max;

  if(isToday(currentDate)){

    max=
      Number(p.hour)-1;

  }else{

    max=23;

  }


  if(max>=0){

    for(
      let h=0;
      h<=max;
      h++
    ){

      entries.push(
        [
          h,
          all[hourKey(h)]||{}
        ]
      );

    }

  }


  $("available").textContent=
    String(entries.length);


  $("doneCount").textContent=
    String(
      entries.reduce(
        (count,[,slot])=>
          count+
          (slot?.[user.uid]?1:0),
        0
      )
    );


  $("dateLabel").textContent=
    isToday(currentDate)
      ?"今天"
      :`歷史日期：${dateKey(currentDate)}`;


  $("yesterday")
    .classList.toggle(
      "hide",
      !isToday(currentDate)
    );


  $("today")
    .classList.toggle(
      "hide",
      isToday(currentDate)
    );


  renderMembers();

  renderTimeline(entries);

  renderNotify();

  applyTheme();

}


function renderMembers(){

  const members=
    room.members||{};

  const entries=
    room.records||{};

  const ownerUid=
    room.meta?.ownerUid;


  const list=
    Object.entries(members);


  $("members").innerHTML=
    list
      .map(
        ([uid,m])=>{

          const done=
            Object.values(entries)
              .some(
                slot=>Boolean(
                  slot?.[uid]
                )
              );


          const owner=
            uid===ownerUid;


          return `
            <div class="member">

              <span class="memberName">
                👤
                ${escapeHtml(
                  m?.displayName||
                  "未命名"
                )}

                ${
                  owner
                    ?'<span class="ownerMark">👑 房主</span>'
                    :""
                }
              </span>

              <span class="badge ${
                done
                  ?"done"
                  :"wait"
              }">
                ${
                  done
                    ?"已完成"
                    :"等待中"
                }
              </span>

            </div>
          `;

        }
      )
      .join("")
      ||
      "<div class='muted'>沒有成員</div>";

}


function renderTimeline(entries){

  const p=
    taipeiParts(new Date());


  if(!entries.length){

    $("slots").innerHTML=
      `
      <div class="emptyTimeline">
        今天還沒有已到達的紀錄點。
        <br>
        可以按「📍 記錄現在」記錄目前時刻。
      </div>
      `;

    return;
  }


  $("slots").innerHTML=
    entries
      .map(
        ([h,users])=>{

          const mine=
            users?.[user.uid]||
            null;

          const current=
            isToday(currentDate)&&
            h===Number(p.hour);

          let media="";


          if(
            mine?.media?.downloadURL
          ){

            if(
              (mine.media.contentType||"")
                .startsWith("image/")
            ){

              media=
                `
                <div class="media">
                  <img
                    src="${escapeHtml(
                      mine.media.downloadURL
                    )}"
                    alt="圖片"
                  >
                </div>
                `;

            }else if(
              (mine.media.contentType||"")
                .startsWith("video/")
            ){

              media=
                `
                <div class="media">
                  <video
                    src="${escapeHtml(
                      mine.media.downloadURL
                    )}"
                    controls
                    playsinline
                  ></video>
                </div>
                `;

            }

          }


          return `
            <div class="slot">

              <div class="time">
                ${pad(h)}:00
              </div>

              <div class="slotBox">

                <div class="slotTitle">

                  <b>
                    ${
                      mine
                        ?"📌 已記錄"
                        :current
                          ?"⏰ 現在"
                          :"尚未紀錄"
                    }
                  </b>

                </div>

                ${
                  mine
                    ?'<div class="pill done">✅ 你已完成</div>'
                    :""
                }

                ${
                  current
                    ?'<div class="pill now">🔔 現在要記錄</div>'
                    :""
                }

                ${
                  mine?.text
                    ?`
                      <div class="caption">
                        ${escapeHtml(mine.text)}
                      </div>
                    `
                    :""
                }

                ${media}

                <div style="margin-top:9px">

                  <button
                    class="btn ${
                      mine
                        ?"primary"
                        :""
                    }"
                    data-hour="${h}"
                  >
                    ${
                      mine
                        ?"編輯紀錄"
                        :"立即紀錄"
                    }
                  </button>

                </div>

              </div>

            </div>
          `;

        }
      )
      .join("");


  document
    .querySelectorAll("[data-hour]")
    .forEach(
      button=>{
        button.onclick=()=>{
          openRecord(
            Number(
              button.dataset.hour
            )
          );
        };
      }
    );

}


function openRecord(h){

  if(!user){

    toast("請先登入");

    return;
  }

  activeHour=h;

  selectedFile=null;

  const mine=
    room?.records?.[hourKey(h)]?.[user.uid]||
    null;


  $("recordWhen").textContent=
    `${dateKey(currentDate)} · ${pad(h)}:00`;


  $("caption").value=
    mine?.text||
    "";


  $("uploadStatus")
    .classList.add("hide");


  renderPreview(
    mine?.media?.downloadURL,
    mine?.media?.contentType
  );


  $("recordModal")
    .classList.add("show");

}


function closeRecord(){

  if(
    selectedFile?.previewUrl
  ){

    URL.revokeObjectURL(
      selectedFile.previewUrl
    );

  }

  $("recordModal")
    .classList.remove("show");

  selectedFile=null;

  activeHour=null;

  $("preview").innerHTML="";

  $("uploadStatus")
    .classList.add("hide");

}


function renderPreview(
  url,
  type,
  fileUrl=""
){

  const src=
    fileUrl||
    url;


  if(!src){

    $("preview").innerHTML="";

    return;
  }


  if(
    (type||"")
      .startsWith("image/")
  ){

    $("preview").innerHTML=
      `
      <div class="media">
        <img
          src="${escapeHtml(src)}"
          alt="預覽"
        >
      </div>
      `;

  }else{

    $("preview").innerHTML=
      `
      <div class="media">
        <video
          src="${escapeHtml(src)}"
          controls
          playsinline
        ></video>
      </div>
      `;

  }

}


function chooseFile(file){

  if(!file)return;


  if(
    !/^(image|video)\//.test(
      file.type
    )
  ){

    toast(
      "只支援圖片或影片"
    );

    return;
  }


  if(
    file.size>
    250*1024*1024
  ){

    toast(
      "單檔不能超過 250MB"
    );

    return;
  }


  if(
    selectedFile?.previewUrl
  ){

    URL.revokeObjectURL(
      selectedFile.previewUrl
    );

  }


  selectedFile={
    file,
    previewUrl:
      URL.createObjectURL(file)
  };


  renderPreview(
    "",
    file.type,
    selectedFile.previewUrl
  );

}


function setUploadStatus(text){

  $("uploadStatus").textContent=
    text;

  $("uploadStatus")
    .classList.remove("hide");

}


async function saveRecord(){

  if(
    activeHour===null||
    !user||
    !roomId
  ){

    toast("目前無法儲存紀錄");

    return;
  }


  const path=
    recordPath(
      currentDate,
      activeHour,
      user.uid
    );


  const old=
    room?.records?.[
      hourKey(activeHour)
    ]?.[user.uid]||
    null;


  let media=
    old?.media||
    null;


  let newStoragePath=null;


  try{

    setUploadStatus(
      selectedFile
        ?"正在上傳媒體…"
        :"正在儲存紀錄…"
    );


    if(selectedFile){

      const file=
        selectedFile.file;


      newStoragePath=
        `room-media/${roomId}/${user.uid}/${dateKey(currentDate)}_${pad(activeHour)}/${crypto.randomUUID()}-${safeFileName(file.name)}`;


      const sr=
        storageRef(
          storage,
          newStoragePath
        );


      await uploadBytes(
        sr,
        file,
        {
          contentType:file.type,
          customMetadata:{
            roomId,
            uid:user.uid
          }
        }
      );


      media={
        storagePath:newStoragePath,
        downloadURL:
          await getDownloadURL(sr),
        contentType:file.type,
        name:file.name,
        size:file.size
      };

    }


    const text=
      $("caption")
        .value
        .trim();


    const now=Date.now();


    await set(
      ref(db,path),
      {
        date:dateKey(currentDate),
        hour:activeHour,
        text,
        authorUid:user.uid,
        authorName:
          localStorage.getItem(
            "momentlog_name"
          )||
          $("name").value.trim()||
          "我",
        savedAt:
          old?.savedAt||
          now,
        updatedAt:now,
        media
      }
    );


    if(
      old?.media?.storagePath&&
      newStoragePath&&
      old.media.storagePath!==newStoragePath
    ){

      deleteObject(
        storageRef(
          storage,
          old.media.storagePath
        )
      )
      .catch(
        console.warn
      );

    }


    closeRecord();

    toast(
      "已同步到雲端"
    );

  }catch(error){

    if(newStoragePath){

      try{

        await deleteObject(
          storageRef(
            storage,
            newStoragePath
          )
        );

      }catch{}

    }


    console.error(
      "saveRecord error:",
      error
    );


    setUploadStatus(
      "儲存失敗："+friendlyError(error)
    );


    toast(
      "儲存失敗："+friendlyError(error)
    );

  }

}


async function removeMedia(){

  if(
    activeHour===null||
    !user
  ){

    return;
  }


  const old=
    room?.records?.[
      hourKey(activeHour)
    ]?.[user.uid]||
    null;


  if(!old?.media?.storagePath){

    toast(
      "目前沒有媒體"
    );

    return;
  }


  try{

    setUploadStatus(
      "正在移除媒體…"
    );


    await set(
      ref(
        db,
        recordPath(
          currentDate,
          activeHour,
          user.uid
        )
      ),
      {
        ...old,
        media:null,
        updatedAt:Date.now()
      }
    );


    try{

      await deleteObject(
        storageRef(
          storage,
          old.media.storagePath
        )
      );

    }catch(error){

      console.warn(
        "Storage delete error:",
        error
      );

    }


    selectedFile=null;

    $("preview").innerHTML="";

    toast(
      "媒體已移除"
    );

  }catch(error){

    console.error(
      "removeMedia error:",
      error
    );

    setUploadStatus(
      "移除失敗："+friendlyError(error)
    );

    toast(
      "移除失敗："+friendlyError(error)
    );

  }

}


async function toggleNotification(){

  if(!user||!roomId){

    toast("請先登入並加入房間");

    return;
  }


  try{

    if(
      room?.myNotification?.enabled===true
    ){

      await update(
        ref(
          db,
          `rooms/${roomId}/notificationSettings/${user.uid}`
        ),
        {
          enabled:false,
          updatedAt:Date.now()
        }
      );

      toast(
        "提醒已關閉"
      );

      return;
    }


    if(
      !(await isSupported())||
      !("Notification" in window)
    ){

      toast(
        "這個瀏覽器不支援背景推播"
      );

      return;
    }


    if(
      Notification.permission==="denied"
    ){

      toast(
        "請到瀏覽器網站設定允許通知"
      );

      return;
    }


    if(
      Notification.permission==="default"
    ){

      const permission=
        await Notification.requestPermission();


      if(
        permission!=="granted"
      ){

        toast(
          "沒有允許通知"
        );

        return;
      }

    }


    const registration=
      await navigator.serviceWorker.register(
        "./firebase-messaging-sw.js",
        {
          scope:"./"
        }
      );


    const messaging=
      getMessaging(app);


    const token=
      await getToken(
        messaging,
        {
          vapidKey:VAPID_PUBLIC_KEY,
          serviceWorkerRegistration:
            registration
        }
      );


    if(!token){

      throw new Error(
        "無法取得推播 token"
      );
    }


    await set(
      ref(
        db,
        `fcmTokens/${user.uid}/${tokenKey(token)}`
      ),
      {
        token,
        createdAt:Date.now(),
        updatedAt:Date.now(),
        userAgent:
          navigator.userAgent
      }
    );


    await update(
      ref(
        db,
        `rooms/${roomId}/notificationSettings/${user.uid}`
      ),
      {
        enabled:true,
        timezone:"Asia/Taipei",
        updatedAt:Date.now()
      }
    );


    toast(
      "提醒已開啟"
    );

  }catch(error){

    console.error(
      "notification error:",
      error
    );

    toast(
      "通知設定失敗："+friendlyError(error)
    );

  }

}


async function initForegroundMessaging(){

  try{

    if(
      messagingReady||
      !(await isSupported())
    ){

      return;
    }


    onMessage(
      getMessaging(app),
      payload=>{

        toast(
          payload?.notification?.body||
          payload?.data?.body||
          "該記錄了！"
        );

      }
    );


    messagingReady=true;

  }catch(error){

    console.warn(
      "FCM init error:",
      error
    );

  }

}

async function leaveRoom(){

  if(!user||!roomId){

    toast(
      "目前沒有加入房間"
    );

    return;
  }


  if(
    !confirm(
      "確定要離開這個房間嗎？"
    )
  ){

    return;
  }


  const oldRoomId=roomId;


  try{

    const members=
      room?.members||{};


    const memberIds=
      Object.keys(members);


    /*
     * 只有自己：
     * 整個房間刪除。
     */

    if(
      memberIds.length===1&&
      memberIds[0]===user.uid
    ){

      await remove(
        ref(
          db,
          `rooms/${oldRoomId}`
        )
      );


      clearListeners();

      room=null;

      roomId="";

      currentDate=new Date();

      localStorage.removeItem(
        "momentlog_room"
      );

      $("room")
        .classList.add("hide");

      $("setup")
        .classList.remove("hide");

      toast(
        "你是最後一位成員，房間已刪除"
      );

      return;
    }


    /*
     * 房主：
     * 從其他成員選一位新的房主。
     */

    if(isOwner()){

      const newOwnerUid=
        memberIds.find(
          uid=>uid!==user.uid
        );


      if(!newOwnerUid){

        throw new Error(
          "找不到新的房主"
        );
      }


      const newOwnerName=
        members[newOwnerUid]
          ?.displayName||
        "下一位成員";


      /*
       * 多位置原子更新：
       * 1. 換房主
       * 2. 移除舊房主
       * 3. 移除舊房主通知設定
       */

      await update(
        ref(db),
        {
          [`rooms/${oldRoomId}/meta/ownerUid`]:
            newOwnerUid,

          [`rooms/${oldRoomId}/meta/updatedAt`]:
            Date.now(),

          [`rooms/${oldRoomId}/members/${user.uid}`]:
            null,

          [`rooms/${oldRoomId}/notificationSettings/${user.uid}`]:
            null
        }
      );


      clearListeners();

      room=null;

      roomId="";

      currentDate=new Date();

      localStorage.removeItem(
        "momentlog_room"
      );

      $("room")
        .classList.add("hide");

      $("setup")
        .classList.remove("hide");


      toast(
        `已離開房間，${newOwnerName} 成為新房主`
      );

      return;
    }


    /*
     * 一般成員：
     * 只移除自己。
     */

    await remove(
      ref(
        db,
        `rooms/${oldRoomId}/members/${user.uid}`
      )
    );


    try{

      await remove(
        ref(
          db,
          `rooms/${oldRoomId}/notificationSettings/${user.uid}`
        )
      );

    }catch(error){

      console.warn(
        "notification setting remove error:",
        error
      );

    }


    clearListeners();

    room=null;

    roomId="";

    currentDate=new Date();

    localStorage.removeItem(
      "momentlog_room"
    );


    $("room")
      .classList.add("hide");

    $("setup")
      .classList.remove("hide");


    toast(
      "已離開房間"
    );


  }catch(error){

    console.error(
      "leaveRoom error:",
      error
    );


    toast(
      "離開房間失敗："+friendlyError(error)
    );

  }

}

function tick(){

  const now=new Date();

  const p=taipeiParts(now);


  $("clock").textContent=
    `${p.hour}:${p.minute}:${p.second}`;


  if(
    !room?.meta||
    !isToday(currentDate)
  ){

    $("next").textContent=
      "正在查看歷史紀錄";

    return;
  }


  /*
   * 時間軸只顯示已經結束的整點。
   *
   * 例如：
   * 21:00 ~ 21:59
   * 時間軸最多顯示 20:00。
   */

  const currentHour=
    Number(p.hour);


  const max=
    currentHour-1;


  const all=
    room.records||{};


  const entries=[];


  for(
    let h=0;
    h<=max;
    h++
  ){

    entries.push(
      [
        h,
        all[hourKey(h)]||{}
      ]
    );

  }


  if(
    renderTimer===null||
    renderTimer!==max
  ){

    renderTimer=max;

    renderTimeline(entries);

    $("available").textContent=
      String(entries.length);

    $("doneCount").textContent=
      String(
        entries.reduce(
          (count,[,slot])=>
            count+
            (slot?.[user?.uid]?1:0),
          0
        )
      );

  }


  const next=
    new Date(now);


  next.setSeconds(0,0);

  next.setMinutes(0,0);

  next.setHours(
    next.getHours()+1
  );


  const np=
    taipeiParts(next);


  $("next").textContent=
    `下一個紀錄點 ${np.hour}:00`;

}

<!doctype html>
<html lang="zh-Hant" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7fb">
<meta name="description" content="MomentLog - 一起記錄每個時刻">
<meta name="google" content="notranslate">
<link rel="manifest" href="./manifest.webmanifest">
<title>MomentLog</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

:root{
  --bg:linear-gradient(135deg,#eef2ff,#f8fafc);
  --text:#172033;
  --muted:#718096;
  --border:#e6eaf0;
  --card:#fff;
  --primary:#4f46e5
}

html,
body{
  margin:0;
  min-height:100%;
  background:#f8fafc
}

body{
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color:var(--text);
  background:var(--bg);
  transition:.25s
}

body.dark{
  --text:#e5e7eb;
  --muted:#94a3b8;
  --border:#334155;
  --card:#172033;
  background:#0f172a
}

body.dark .card,
body.dark .btn,
body.dark .field input,
body.dark .field textarea,
body.dark .field select,
body.dark .slotBox,
body.dark .member,
body.dark .stat,
body.dark .modalCard,
body.dark .status{
  background:#172033;
  color:#e5e7eb;
  border-color:#334155
}

button,
input,
textarea,
select{
  font:inherit
}

button{
  cursor:pointer
}

button:disabled{
  opacity:.55;
  cursor:not-allowed
}

.hide{
  display:none!important
}

.app{
  width:min(1160px,100%);
  margin:auto;
  padding:16px 16px 90px
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:14px
}

.brand{
  display:flex;
  gap:10px;
  align-items:center
}

.icon{
  width:45px;
  height:45px;
  border-radius:14px;
  background:#111827;
  color:#fff;
  display:grid;
  place-items:center;
  font-size:22px;
  flex:none
}

.brand h1{
  margin:0;
  font-size:21px
}

.brand small,
.muted{
  color:var(--muted)
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:flex-end
}

.btn{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:12px;
  padding:10px 13px;
  min-height:40px
}

.btn.primary{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary)
}

.btn.danger{
  background:#fee2e2;
  color:#dc2626;
  border-color:#fecaca
}

.btn.active{
  background:#dcfce7;
  color:#166534;
  border-color:#86efac
}

.card{
  background:rgba(255,255,255,.96);
  border-radius:20px;
  box-shadow:0 14px 38px rgba(15,23,42,.08)
}

.setup{
  max-width:620px;
  margin:7vh auto;
  padding:28px
}

.setup h2{
  margin:0 0 8px
}

.setup p{
  line-height:1.7;
  color:var(--muted)
}

.field{
  margin:12px 0
}

.field label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:6px
}

.field input,
.field textarea,
.field select{
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--card);
  color:var(--text);
  outline:none
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:#818cf8;
  box-shadow:0 0 0 3px rgba(99,102,241,.1)
}

.setupActions{
  display:grid;
  gap:8px;
  margin-top:14px
}

.privacy{
  margin-top:10px;
  color:var(--muted);
  font-size:12px;
  line-height:1.6
}

.account{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border:1px solid var(--border);
  border-radius:13px;
  background:#f8fafc;
  margin-top:12px
}

.accountAvatar{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
  background:#e0e7ff;
  flex:none
}

.accountInfo{
  min-width:0;
  flex:1
}

.accountName{
  font-weight:800;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.accountEmail{
  font-size:12px;
  color:var(--muted);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.recentRooms{
  margin-top:18px;
  border-top:1px solid var(--border);
  padding-top:18px
}

.recentHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:10px
}

.recentHead h3{
  margin:0;
  font-size:16px
}

.recentList{
  display:grid;
  gap:8px
}

.recentRoom{
  border:1px solid var(--border);
  border-radius:14px;
  padding:11px;
  background:var(--card);
  display:flex;
  align-items:center;
  gap:10px
}

.recentRoomInfo{
  min-width:0;
  flex:1
}

.recentRoomName{
  font-weight:800;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.recentRoomMeta{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
  line-height:1.5
}

.recentRoomActions{
  display:flex;
  gap:6px;
  flex:none
}

.hero{
  padding:18px;
  margin-bottom:14px
}

.heroRow{
  display:flex;
  justify-content:space-between;
  gap:10px
}

.hero h2{
  margin:0;
  font-size:24px
}

.clock{
  font-size:25px;
  font-weight:800;
  text-align:right
}

.next{
  font-size:12px;
  color:var(--muted);
  text-align:right;
  margin-top:2px
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:14px
}

.stat{
  padding:12px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--card)
}

.statTitle{
  font-size:12px;
  color:var(--muted)
}

.statValue{
  font-size:18px;
  font-weight:800;
  margin-top:4px;
  word-break:break-word
}

.grid{
  display:grid;
  grid-template-columns:280px 1fr;
  gap:14px
}

.side{
  padding:15px;
  position:sticky;
  top:12px;
  align-self:start
}

.sideTitle{
  font-weight:800;
  margin-bottom:10px
}

.members{
  display:grid;
  gap:8px
}

.member{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center;
  border:1px solid var(--border);
  border-radius:12px;
  padding:9px;
  background:var(--card)
}

.memberName{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.memberRight{
  display:flex;
  gap:5px;
  align-items:center;
  flex:none
}

.badge{
  padding:5px 8px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap
}

.badge.done{
  background:#dcfce7;
  color:#166534
}

.badge.wait{
  background:#fef3c7;
  color:#92400e
}

.badge.owner{
  background:#e0e7ff;
  color:#3730a3
}

.sideButtons{
  display:grid;
  gap:8px;
  margin-top:14px
}

.timeline{
  padding:16px;
  min-width:0
}

.timelineHead{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin-bottom:12px
}

.timelineHead h3{
  margin:0
}

.slots{
  display:grid;
  gap:10px
}

.emptyTimeline{
  padding:28px 15px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--border);
  border-radius:14px;
  background:#f8fafc
}

.slot{
  display:grid;
  grid-template-columns:60px 1fr;
  gap:8px
}

.time{
  font-size:12px;
  font-weight:800;
  color:var(--muted);
  text-align:right;
  padding-top:11px
}

.slotBox{
  border:1px solid var(--border);
  border-radius:14px;
  padding:11px;
  background:var(--card)
}

.slotTitle{
  display:flex;
  justify-content:space-between;
  gap:8px
}

.pill{
  display:inline-flex;
  margin-top:8px;
  padding:6px 9px;
  border-radius:9px;
  font-size:12px;
  font-weight:800
}

.pill.done{
  background:#dcfce7;
  color:#166534
}

.caption{
  margin-top:8px;
  line-height:1.65;
  white-space:pre-wrap;
  word-break:break-word
}

.media{
  margin-top:9px;
  border-radius:11px;
  overflow:hidden;
  background:#111827
}

.media img,
.media video{
  display:block;
  width:100%;
  max-height:500px;
  object-fit:contain
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.56);
  display:none;
  align-items:center;
  justify-content:center;
  padding:12px;
  z-index:1000
}

.modal.show{
  display:flex
}

.modalCard{
  width:min(620px,100%);
  background:var(--card);
  color:var(--text);
  border-radius:20px;
  padding:17px;
  max-height:90vh;
  overflow:auto
}

.modalHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px
}

.close{
  width:38px;
  height:38px;
  border:1px solid var(--border);
  border-radius:50%;
  background:var(--card);
  color:var(--text)
}

.mediaBtns{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px
}

.hidden{
  display:none
}

.modalActions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:14px
}

.themeGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px
}

.themeOpt{
  border:2px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:12px;
  padding:8px;
  text-align:left
}

.themeOpt.selected{
  border-color:var(--primary)
}

.swatch{
  height:48px;
  border-radius:9px;
  margin-bottom:6px
}

.progress{
  height:8px;
  border-radius:999px;
  background:#e5e7eb;
  overflow:hidden;
  margin-top:8px
}

.progressBar{
  height:100%;
  width:0;
  background:var(--primary);
  transition:.2s
}

.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  z-index:3000;
  display:none;
  background:#111827;
  color:#fff;
  padding:10px 14px;
  border-radius:999px;
  font-size:13px;
  max-width:calc(100vw - 30px);
  text-align:center
}

@media(max-width:820px){
  .grid{grid-template-columns:1fr}
  .side{position:static}
  .heroRow{flex-direction:column}
  .clock,.next{text-align:left}
}

@media(max-width:580px){
  .stats{grid-template-columns:1fr 1fr}
  .actions{display:grid;grid-template-columns:1fr 1fr}
  .mediaBtns{grid-template-columns:1fr 1fr}
  .themeGrid{grid-template-columns:1fr}
  .slot{grid-template-columns:52px 1fr}
  .modalActions{display:grid;grid-template-columns:1fr 1fr}
  .recentRoom{
    align-items:flex-start
  }
  .recentRoomActions{
    flex-direction:column
  }
}
</style>
</head>

<body>

<div class="app">

<section id="setup" class="setup card">

<div class="icon">⏱️</div>

<h2>MomentLog</h2>

<p>
Google 登入、多人房間、即時同步，一起記錄每個時刻。
</p>

<div id="loginArea">

<button
id="googleLogin"
class="btn primary"
type="button"
>
🔐 使用 Google 帳號登入
</button>

<div class="privacy">
Google 帳號只用於 Firebase 身分驗證。
房間內顯示的是你的 MomentLog 自訂暱稱。
</div>

</div>

<div id="profileArea" class="hide">

<div class="account">

<img
id="accountAvatar"
class="accountAvatar"
alt=""
>

<div class="accountInfo">

<div
id="accountName"
class="accountName"
></div>

<div
id="accountEmail"
class="accountEmail"
></div>

</div>

<button
id="logout"
class="btn"
type="button"
>
登出
</button>

</div>

<div class="field">
<label for="name">你的暱稱</label>
<input
id="name"
maxlength="30"
placeholder="例如：小明"
autocomplete="nickname"
translate="no"
>
</div>

<div class="field">
<label for="log">Log 名稱</label>
<input
id="log"
maxlength="60"
placeholder="例如：我們的暑假"
autocomplete="off"
translate="no"
>
</div>

<div class="setupActions">

<button
id="saveProfile"
class="btn"
type="button"
>
保存個人資料
</button>

<button
id="create"
class="btn primary"
type="button"
>
建立新房間
</button>

</div>

<hr
style="border:0;border-top:1px solid var(--border);margin:18px 0"
>

<div class="field">

<label for="joinCode">
加入房間碼
</label>

<input
id="joinCode"
maxlength="12"
placeholder="例如 ABCD1234"
autocomplete="off"
translate="no"
>

</div>

<button
id="join"
class="btn"
type="button"
>
加入房間
</button>

<div
id="recentRooms"
class="recentRooms hide"
>

<div class="recentHead">

<h3>
🏠 曾加入的房間
</h3>

<button
id="clearRecentRooms"
class="btn"
type="button"
style="padding:7px 10px;min-height:34px;font-size:12px"
>
清除紀錄
</button>

</div>

<div
id="recentRoomList"
class="recentList"
></div>

</div>

</div>

<div
id="setupStatus"
class="muted"
style="font-size:13px;margin-top:10px"
>
請先登入 Google 帳號
</div>

</section>

<section id="room" class="hide">

<header class="top">

<div class="brand">

<div class="icon">
⏱️
</div>

<div>

<h1>MomentLog</h1>

<small>
一起記錄每個時刻
</small>

</div>

</div>

<div class="actions">

<button
id="notify"
class="btn"
type="button"
>
🔕 通知：關閉
</button>

<button
id="theme"
class="btn"
type="button"
>
🎨 主題
</button>

<button
id="invite"
class="btn"
type="button"
>
邀請
</button>

<button
id="leave"
class="btn danger"
type="button"
>
離開房間
</button>

</div>

</header>

<section class="hero card">

<div class="heroRow">

<div>

<h2 id="title">
MomentLog
</h2>

<div
id="sub"
class="muted"
></div>

</div>

<div>

<div
id="clock"
class="clock"
>
00:00:00
</div>

<div
id="next"
class="next"
></div>

</div>

</div>

<div class="stats">

<div class="stat">

<div class="statTitle">
已到時段
</div>

<div
id="available"
class="statValue"
>
0
</div>

</div>

<div class="stat">

<div
id="doneLabel"
class="statTitle"
>
今日已完成
</div>

<div
id="doneCount"
class="statValue"
>
0
</div>

</div>

<div class="stat">

<div class="statTitle">
房間碼
</div>

<div
id="roomCode"
class="statValue"
></div>

</div>

</div>

</section>

<main class="grid">

<aside class="side card">

<div class="sideTitle">
房間成員
</div>

<div
id="members"
class="members"
></div>

<div class="sideButtons">

<button
id="now"
class="btn primary"
type="button"
>
📍 記錄現在
</button>

<button
id="yesterday"
class="btn"
type="button"
>
查看昨天
</button>

<button
id="today"
class="btn hide"
type="button"
>
↩ 返回今天
</button>

<button
id="prevDate"
class="btn"
type="button"
>
◀ 前一天
</button>

<button
id="nextDate"
class="btn"
type="button"
>
下一天 ▶
</button>

</div>

</aside>

<section class="timeline card">

<div class="timelineHead">

<div>

<h3>
時間軸
</h3>

<div
id="dateLabel"
class="muted"
style="font-size:13px;margin-top:4px"
></div>

</div>

</div>

<div
id="slots"
class="slots"
></div>

</section>

</main>

</section>

</div>

<div
id="recordModal"
class="modal"
>

<div class="modalCard">

<div class="modalHead">

<div>

<h3>
記錄這個時刻
</h3>

<div
id="recordWhen"
class="muted"
></div>

</div>

<button
id="recordClose"
class="close"
type="button"
>
×
</button>

</div>

<div class="field">

<label for="caption">
內容
</label>

<textarea
id="caption"
maxlength="3000"
rows="6"
placeholder="寫下這一刻發生了什麼…"
translate="no"
></textarea>

</div>

<div class="mediaBtns">

<button
id="photo"
class="btn"
type="button"
>
📷 拍照
</button>

<button
id="video"
class="btn"
type="button"
>
🎥 錄影
</button>

<button
id="album"
class="btn"
type="button"
>
🖼️ 相簿
</button>

<button
id="remove"
class="btn danger"
type="button"
>
🗑️ 移除媒體
</button>

</div>

<input
id="photoInput"
class="hidden"
type="file"
accept="image/*"
capture="environment"
>

<input
id="videoInput"
class="hidden"
type="file"
accept="video/*"
capture="environment"
>

<input
id="albumInput"
class="hidden"
type="file"
accept="image/*,video/*"
>

<div id="preview"></div>

<div
id="uploadStatus"
class="status hide"
>

<div id="uploadText"></div>

<div class="progress">

<div
id="progressBar"
class="progressBar"
></div>

</div>

</div>

<div class="modalActions">

<button
id="cancelRecord"
class="btn"
type="button"
>
取消
</button>

<button
id="saveRecord"
class="btn primary"
type="button"
>
儲存
</button>

</div>

</div>

</div>

<div
id="themeModal"
class="modal"
>

<div class="modalCard">

<div class="modalHead">

<h3>
🎨 背景主題
</h3>

<button
id="themeClose"
class="close"
type="button"
>
×
</button>

</div>

<div class="themeGrid">

<button class="themeOpt" data-theme="default" type="button">
<div class="swatch" style="background:linear-gradient(135deg,#eef2ff,#f8fafc)"></div>
🌤️ 預設
</button>

<button class="themeOpt" data-theme="blue" type="button">
<div class="swatch" style="background:linear-gradient(135deg,#dbeafe,#eff6ff)"></div>
🌊 藍色
</button>

<button class="themeOpt" data-theme="green" type="button">
<div class="swatch" style="background:linear-gradient(135deg,#dcfce7,#f0fdf4)"></div>
🌿 綠色
</button>

<button class="themeOpt" data-theme="pink" type="button">
<div class="swatch" style="background:linear-gradient(135deg,#fce7f3,#fff1f2)"></div>
🌸 粉色
</button>

<button class="themeOpt" data-theme="purple" type="button">
<div class="swatch" style="background:linear-gradient(135deg,#ede9fe,#f5f3ff)"></div>
💜 紫色
</button>

<button class="themeOpt" data-theme="sunset" type="button">
<div class="swatch" style="background:linear-gradient(135deg,#ffedd5,#fef3c7)"></div>
🌅 日落
</button>

<button class="themeOpt" data-theme="dark" type="button">
<div class="swatch" style="background:linear-gradient(135deg,#1e293b,#0f172a)"></div>
🌌 黑暗
</button>

</div>

</div>

</div>

<div
id="toast"
class="toast"
></div>

<script type="module">

import {
  GoogleAuthProvider,
  signInWithRedirect,
  getRedirectResult,
  signOut,
  onAuthStateChanged
} from "https:\u002F\u002Fwww.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

import {
  ref,
  get,
  set,
  update,
  remove,
  onValue,
  runTransaction

const taipeiParts =
  date =>
    new Intl.DateTimeFormat(
      "zh-TW",
      {
        timeZone:"Asia/Taipei",
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hourCycle:"h23"
      }
    )
    .formatToParts(date)
    .reduce(
      (obj,part) => {

        if(
          part.type !==
          "literal"
        ){

          obj[part.type] =
            part.value;

        }

        return obj;

      },
      {}
    );


const dateKey =
  date => {

    const p =
      taipeiParts(date);

    return `${p.year}-${p.month}-${p.day}`;

  };


const addDays =
  (date,amount) => {

    const result =
      new Date(date);

    result.setDate(
      result.getDate() +
      amount
    );

    return result;

  };


const isToday =
  date =>
    dateKey(date) ===
    dateKey(new Date());


const escapeHtml =
  value =>
    String(value ?? "")
      .replace(
        /[&<>"']/g,
        match =>
          ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
          })[match]
      );


const tokenKey =
  token => {

    const bytes =
      new TextEncoder()
        .encode(
          token
        );

    let output =
      "";

    for(
      const byte of bytes
    ){

      output +=
        String.fromCharCode(
          byte
        );

    }

    return btoa(output)
      .replace(
        /\+/g,
        "-"
      )
      .replace(
        /\//g,
        "_"
      )
      .replace(
        /=+$/g,
        ""
      );

  };

function friendlyError(
  error
){

  const code =
    typeof error?.code === "string"
      ? error.code
      : "";

  const message =
    typeof error?.message === "string"
      ? error.message
      : String(
          error?.message ||
          error ||
          "未知錯誤"
        );


  if(
    code.includes(
      "permission-denied"
    ) ||
    code ===
      "PERMISSION_DENIED"
  ){

    return(
      "Firebase 權限被拒絕，請檢查 Realtime Database Rules"
    );

  }


  if(
    code ===
      "auth/unauthorized-domain"
  ){

    return(
      "目前網站網域尚未加入 Firebase Authentication 授權網域"
    );

  }


  if(
    code ===
      "auth/operation-not-allowed"
  ){

    return(
      "Firebase 尚未啟用 Google 登入"
    );

  }


  if(
    code ===
      "auth/popup-blocked"
  ){

    return(
      "瀏覽器阻擋 Google 登入視窗"
    );

  }


  if(
    code ===
      "auth/popup-closed-by-user"
  ){

    return(
      "你關閉了 Google 登入視窗"
    );

  }


  if(
    code ===
      "messaging/permission-blocked"
  ){

    return(
      "瀏覽器封鎖了推播通知"
    );

  }


  return message;

}


function getRecentRooms(){

        RECENT_ROOMS_KEY

      raw

    return Array.isArray(list)
      ? list
      : [];

  }catch{

    return [];

  }

}


function saveRecentRooms(
  list
){

  try{

    localStorage.setItem(
      RECENT_ROOMS_KEY,
      JSON.stringify(
        list.slice(
          0,
          MAX_RECENT_ROOMS
        )
      )
    );

  }catch(error){

    console.warn(
      "saveRecentRooms:",
      error
    );

  }

}


function rememberRoom(
  id,
  name
){

  if(
    !id ||
    !/^[A-Z0-9]{8,12}$/.test(
      id
    )
  ){

    return;

  }

  const old =
    getRecentRooms()
      .filter(
        item =>
          item?.roomId !== id
      );

  old.unshift({

    roomId:
      id,

    name:
      String(
        name ||
        "MomentLog"
      ).slice(
        0,
        60
      ),

    lastJoinedAt:
      Date.now(),

    lastLeftAt:
      null

  });

  saveRecentRooms(
    old
  );

  renderRecentRooms();

}


function markRecentRoomLeft(
  id
){

  if(!id){

  const list =

  const item =

  }else{

      lastJoinedAt:

}

async function saveProfile(){

  if(!user){

    toast(
      "請先登入 Google 帳號"
    );

    return false;

  }


  const name =
    $("name")
      .value
      .trim();


  if(!name){

    toast(
      "請輸入暱稱"
    );

    $("name")
      .focus();

    return false;

  }


  if(
    name.length >
    30
  ){

    toast(
      "暱稱最多 30 個字"
    );

    return false;

  }


  try{

    const now =
      Date.now();

    await set(
      ref(
        db,
        `users/${user.uid}`
      ),
      {
        displayName:
          name,

        updatedAt:
          now
      }
    );


    if(
      room?.members?.[
        user.uid
      ]
    ){

      await update(
        ref(
          db,
          memberPath(
            user.uid
          )
        ),
        {
          displayName:
            name,

          updatedAt:
            now
        }
      );

    }


    room =
      room ||
      {};

    room.profile = {

      ...(room.profile || {}),

      displayName:
        name,

      updatedAt:
        now

    };


    localStorage.setItem(
      "momentlog_name",
      name
    );


    toast(
      "個人資料已保存"
    );


    return true;

  }catch(error){

    console.error(
      "saveProfile:",
      error
    );

    toast(
      "保存個人資料失敗："+friendlyError(error)
    );

    return false;

  }

}

function createRoomId(){

  if(
    typeof crypto?.randomUUID ===
    "function"
  ){

    return crypto
      .randomUUID()
      .replace(
        /-/g,
        ""
      )
      .slice(
        0,
        8
      )
      .toUpperCase();

  }


  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

  let value =
    "";

  for(
    let i = 0;
    i < 8;
    i++
  ){

    value +=
      chars[
        Math.floor(
          Math.random() *
          chars.length
        )
      ];

  }

  return value;

}


async function createRoom(){

  if(!user){

    toast(
      "請先登入 Google 帳號"
    );

    return;

  }


  const name =
    $("name")
      .value
      .trim();

  const log =
    $("log")
      .value
      .trim();


  if(!name){

    toast(
      "請輸入暱稱"
    );

    $("name").focus();

    return;

  }


  if(!log){

    toast(
      "請輸入 Log 名稱"
    );

    $("log").focus();

    return;

  }


  if(
    !(await saveProfile())
  ){

    return;

  }


  try{

    let id =
      "";

    for(
      let i = 0;
      i < 8 &&
      !id;
      i++
    ){

      const candidate =
        createRoomId();

      const transaction =
        await runTransaction(
          ref(
            db,
            `rooms/${candidate}/meta`
          ),
          current => {

            if(
              current !==
              null
            ){

              return;

            }


            const now =
              Date.now();

            return {

              roomId:
                candidate,

              name:
                log,

              ownerUid:
                user.uid,

              createdAt:
                now,

              updatedAt:
                now

            };

          }
        );


      if(
        transaction.committed
      ){

        id =
          candidate;

      }

    }


    if(!id){

      throw new Error(
        "房間碼建立失敗"
      );

    }


    await set(
      ref(
        db,
        memberPath(
          user.uid,
          id
        )
      ),
      {
        displayName:
          name,

        joinedAt:
          Date.now(),

        updatedAt:
          Date.now()
      }
    );


    localStorage.setItem(
      "momentlog_room",
      id
    );

    localStorage.setItem(
      "momentlog_name",
      name
    );


    rememberRoom(
      id,
      log
    );


    roomId =
      id;

    currentDate =
      new Date();

    followToday =
      true;


    connectRoom();


    toast(
      "房間建立成功"
    );

  }catch(error){

    console.error(
      "createRoom:",
      error
    );

    toast(
      "建立房間失敗："+friendlyError(error)
    );

  }

}

          id
        )
      ),
      {
        displayName:
          name,

        joinedAt:
          now,

        updatedAt:
          now
      }
    );


    await update(
      ref(
        db,
        `users/${user.uid}`
      ),
      {
        displayName:
          name,

        updatedAt:
          now
      }
    ).catch(
      error =>
        console.warn(
          "profile update:",
          error
        )
    );


    localStorage.setItem(
      "momentlog_room",
      id
    );

    localStorage.setItem(
      "momentlog_name",
      name
    );


    rememberRoom(
      id,
      nameFromRoom
    );


    roomId =
      id;

    currentDate =
      new Date();

    followToday =
      true;


    connectRoom();


    toast(
      "已加入房間"
    );

  }catch(error){

    console.error(
      "joinRoom:",
      error
    );

    toast(
      "加入房間失敗："+friendlyError(error)
    );

  }

}


function connectRoom(){

  clearListeners();


  if(
    !roomId ||
    !user
  ){

    return;

  }


  room =
    room ||
    {};


  unsubMeta =
    onValue(
      ref(
        db,
        `rooms/${roomId}/meta`
      ),
      snapshot => {

        if(
          !snapshot.exists()
        ){

          clearListeners();

          stopLocalNotificationCheck();

          room =
            null;

          localStorage.removeItem(
            "momentlog_room"
          );

          $("room")
            .classList
            .add(
              "hide"
            );

          $("setup")
            .classList
            .remove(
              "hide"
            );

          toast(
            "房間不存在或已被關閉"
          );

          return;

        }


        room.meta =
          snapshot.val() ||
          {};


        rememberRoom(
          roomId,
          room.meta.name ||
          "MomentLog"
        );


        render();

      },
      error => {

        console.error(
          "meta listener:",
          error
        );

        toast(
          "房間資料讀取失敗："+friendlyError(error)
        );

      }
    );


  unsubMembers =
    onValue(
      ref(
        db,
        `rooms/${roomId}/members`
      ),
      snapshot => {

        room.members =
          snapshot.val() ||
          {};


        if(
          !room.members[user.uid]
        ){

          clearListeners();

          stopLocalNotificationCheck();

          roomId =
            "";

          localStorage.removeItem(
            "momentlog_room"
          );


          $("room")
            .classList
            .add(
              "hide"
            );

          $("setup")
            .classList
            .remove(
              "hide"
            );

          toast(
            "你已離開這個房間"
          );

          renderRecentRooms();

          return;

        }


        loadRecordsListener();

        render();

      },
      error => {

        console.error(
          "members listener:",
          error
        );

        toast(
          "成員資料讀取失敗："+friendlyError(error)
        );

      }
    );


  unsubSettings =
    onValue(
      ref(
        db,
        `rooms/${roomId}/notificationSettings/${user.uid}`
      ),
      snapshot => {

        const data =
          snapshot.exists()
            ? snapshot.val()
            : null;


        room.myNotification =
          data &&
          typeof data ===
            "object"
            ? data
            : {
                enabled:
                  false
              };


        renderNotify();


        if(
          room.myNotification.enabled ===
          true
        ){

          localStorage.setItem(
            "momentlog_local_notifications",
            "true"
          );

          startLocalNotificationCheck();

        }else{

          localStorage.setItem(
            "momentlog_local_notifications",
            "false"
          );

          stopLocalNotificationCheck();

        }

      },
      error => {

        console.error(
          "notification listener:",
          error
        );

        room.myNotification = {
          enabled:
            false
        };

        renderNotify();

        stopLocalNotificationCheck();

      }
    );

}


function loadRecordsListener(){

  if(
    unsubRecords
  ){

    try{

      unsubRecords();

    }catch(error){

      console.warn(
        "records unsubscribe:",
        error
      );

    }

    unsubRecords =
      null;

  }


  if(
    !roomId ||
    !user ||
    !room?.members?.[
      user.uid
    ]
  ){

    return;

  }


  const targetDate =
    dateKey(
      currentDate
    );


  unsubRecords =
    onValue(
      ref(
        db,
        `rooms/${roomId}/records/${targetDate}`
      ),
      snapshot => {

        room.records =
          snapshot.val() ||
          {};

        render();

      },
      error => {

        console.error(
          "records listener:",
          error
        );

        toast(
          "紀錄讀取失敗："+friendlyError(error)
        );

      }
    );

}


function render(){

  if(
    !room?.meta
  ){

    return;

  }


  $("setup")
    .classList
    .add(
      "hide"
    );

  $("room")
    .classList
    .remove(
      "hide"
    );


  $("title")
    .textContent =
    room.meta.name ||
    "MomentLog";


  $("roomCode")
    .textContent =
    roomId;


  $("sub")
    .textContent =
    `${dateKey(currentDate)} · 房間碼 ${roomId}`;


  const now =
    new Date();

  const p =
    taipeiParts(
      now
    );


  $("clock")
    .textContent =
    `${p.hour}:${p.minute}:${p.second}`;


  const maxHour =
    isToday(
      currentDate
    )
      ? Number(p.hour)
      : 23;


  const all =
    room.records ||
    {};


  const entries =
    [];


  for(
    let h = 0;
    h <= maxHour;
    h++
  ){

    entries.push(
      [
        h,
        all[pad(h)] ||
        {}
      ]
    );

  }


  $("available")
    .textContent =
    String(
      entries.length
    );


  $("doneCount")
    .textContent =
    String(
      entries.reduce(
        (n,[,v]) =>
          n +
          (
            v[user.uid]
              ? 1
              : 0
          ),
        0
      )
    );


  $("doneLabel")
    .textContent =
    isToday(
      currentDate
    )
      ? "今日已完成"
      : "當日已完成";


  $("dateLabel")
    .textContent =
    isToday(
      currentDate
    )
      ? "今天"
      : `歷史日期：${dateKey(currentDate)}`;


  $("yesterday")
    .classList
    .toggle(
      "hide",
      !isToday(
        currentDate
      )
    );


  $("today")
    .classList
    .toggle(
      "hide",
      isToday(
        currentDate
      )
    );


  if(
    isToday(
      currentDate
    )
  ){

    const next =
      new Date(
        now
      );

    next.setSeconds(
      0,
      0
    );

    next.setMinutes(
      0,
      0
    );

    next.setHours(
      next.getHours() +
      1
    );

    const np =
      taipeiParts(
        next
      );


    $("next")
      .textContent =
      `下一個紀錄點 ${np.hour}:00`;

  }else{

    $("next")
      .textContent =
      "正在查看歷史紀錄";

  }


  renderMembers();

  renderTimeline(
    entries
  );

  renderNotify();

  renderAccount();

  applyTheme();

}


function renderMembers(){

  const members =
    room.members ||
    {};

  const entries =
    room.records ||
    {};

  const ownerUid =
    room.meta?.ownerUid;


  $("members")
    .innerHTML =
    Object.entries(
      members
    )
    .map(
      ([uid,m]) => {

        const done =
          Object.values(
            entries
          )
          .some(
            slot =>
              Boolean(
                slot?.[uid]
              )
          );


        const owner =
          uid ===
          ownerUid;


        return `
          <div class="member">

            <span class="memberName">
              👤
              ${escapeHtml(
                m.displayName ||
                "未命名"
              )}
            </span>

            <span class="memberRight">

              ${
                owner
                  ? `
                    <span class="badge owner">
                      房主
                    </span>
                  `
                  : ""
              }

              <span class="badge ${
                done
                  ? "done"
                  : "wait"
              }">
                ${
                  done
                    ? "已完成"
                    : "等待中"
                }
              </span>

            </span>

          </div>
        `;

      }
    )
    .join("")
    ||
    "<div class='muted'>沒有成員</div>";

}


function renderTimeline(
  entries
){

  if(
    !entries.length
  ){

    $("slots")
      .innerHTML =
      `
        <div class="emptyTimeline">
          今天還沒有可顯示的紀錄點。
        </div>
      `;

    return;

  }


  $("slots")
    .innerHTML =
    entries
      .map(
        ([h,users]) => {

          const userEntries =
            Object.entries(
              users || {}
            )
            .filter(
              ([,record]) =>
                Boolean(
                  record
                )
            )
            .sort(
              ([uidA,recordA],[uidB,recordB]) => {

                const timeA =
                  Number(
                    recordA?.updatedAt ||
                    recordA?.savedAt ||
                    0
                  );

                const timeB =
                  Number(
                    recordB?.updatedAt ||
                    recordB?.savedAt ||
                    0
                  );

                if(
                  timeA !==
                  timeB
                ){

                  return timeA - timeB;

                }

                const nameA =
                  room?.members?.[
                    uidA
                  ]?.displayName ||
                  recordA?.authorName ||
                  "";

                const nameB =
                  room?.members?.[
                    uidB
                  ]?.displayName ||
                  recordB?.authorName ||
                  "";

                return String(
                  nameA
                ).localeCompare(
                  String(nameB),
                  "zh-Hant"
                );

              }
            );


          const recordsHtml =
            userEntries
              .map(
                ([uid,record]) => {

                  const memberName =
                    room?.members?.[
                      uid
                    ]?.displayName ||
                    record?.authorName ||
                    "未命名";

                  let media =
                    "";


                  if(
                    record?.media?.downloadURL
                  ){

                    const type =
                      record.media.contentType ||
                      "";


                    if(
                      type.startsWith(
                        "image/"
                      )
                    ){

                      media =
                        `
                          <div class="media">
                            <img
                              src="${escapeHtml(
                                record.media.downloadURL
                              )}"
                              alt="圖片"
                              loading="lazy"
                            >
                          </div>
                        `;

                    }else if(
                      type.startsWith(
                        "video/"
                      )
                    ){

                      media =
                        `
                          <div class="media">
                            <video
                              src="${escapeHtml(
                                record.media.downloadURL
                              )}"
                              controls
                              playsinline
                              preload="metadata"
                            ></video>
                          </div>
                        `;

                    }

                  }


                  const isMine =
                    uid ===
                    user.uid;


                  return `
                    <div
                      style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)"
                    >

                      <div
                        style="display:flex;justify-content:space-between;align-items:center;gap:8px"
                      >

                        <b>
                          👤 ${escapeHtml(
                            memberName
                          )}
                        </b>

                        ${
                          isMine
                            ? `
                              <span class="pill done">
                                ✅ 你
                              </span>
                            `
                            : ""
                        }

                      </div>

                      ${
                        record?.text
                          ? `
                            <div class="caption">
                              ${escapeHtml(
                                record.text
                              )}
                            </div>
                          `
                          : ""
                      }

                      ${media}

                      ${
                        isMine
                          ? `
                            <div style="margin-top:9px">

                              <button
                                class="btn primary"
                                data-hour="${h}"
                                type="button"
                              >
                                編輯紀錄
                              </button>

                            </div>
                          `
                          : ""
                      }

                    </div>
                  `;

                }
              )
              .join("");


          const currentUserRecord =
            users?.[
              user.uid
            ] ||
            null;


          return `
            <div class="slot">

              <div class="time">
                ${pad(h)}:00
              </div>

              <div class="slotBox">

                <div class="slotTitle">

                  <b>
                    ${
                      userEntries.length
                        ? `📌 ${userEntries.length} 人已記錄`
                        : "尚未紀錄"
                    }
                  </b>

                </div>

                ${
                  currentUserRecord
                    ? `
                      <div class="pill done">
                        ✅ 你已完成
                      </div>
                    `
                    : ""
                }

                ${
                  userEntries.length
                    ? recordsHtml
                    : `
                      <div class="muted" style="margin-top:8px">
                        這個時段目前還沒有成員紀錄。
                      </div>
                    `
                }

                ${
                  !currentUserRecord
                    ? `
                      <div style="margin-top:9px">

                        <button
                          class="btn"
                          data-hour="${h}"
                          type="button"
                        >
                          立即紀錄
                        </button>

                      </div>
                    `
                    : ""
                }

              </div>

            </div>
          `;

        }
      )
      .join("");


  document
    .querySelectorAll(
      "[data-hour]"
    )
    .forEach(
      button => {

        button.onclick =
          () => {

            openRecord(
              Number(
                button.dataset.hour
              )
            );

          };

      }
    );

}


function openRecord(
  h
){

  if(
    !user ||
    !roomId
  ){

    toast(
      "請先登入並加入房間"
    );

    return;

  }


  activeHour =
    h;

  selectedFile =
    null;


  const mine =
    room?.records?.[
      pad(h)
    ]?.[
      user.uid
    ] ||
    null;


  $("recordWhen")
    .textContent =
    `${dateKey(currentDate)} · ${pad(h)}:00`;


  $("caption")
    .value =
    mine?.text ||
    "";


  $("uploadStatus")
    .classList
    .add(
      "hide"
    );


  $("uploadText")
    .textContent =
    "";


  $("progressBar")
    .style
    .width =
    "0%";


  renderPreview(
    mine?.media
  );


  $("recordModal")
    .classList
    .add(
      "show"
    );

}


function renderPreview(
  media,
  type,
  fileUrl = ""
){

  const src =
    fileUrl ||
    (
      media &&
      typeof media ===
        "object"
        ? media.downloadURL ||
          ""
        : media ||
          ""
    );


  const contentType =
    type ||
    (
      media &&
      typeof media ===
        "object"
        ? media.contentType ||
          ""
        : ""
    );


  if(!src){

    $("preview")
      .innerHTML =
      "";

    return;

  }


  if(
    contentType.startsWith(
      "image/"
    )
  ){

    $("preview")
      .innerHTML =
      `
        <div class="media">
          <img
            src="${escapeHtml(src)}"
            alt="預覽"
          >
        </div>
      `;

    return;

  }


  $("preview")
    .innerHTML =
    `
      <div class="media">
        <video
          src="${escapeHtml(src)}"
          controls
          playsinline
          preload="metadata"
        ></video>
      </div>
    `;

}

    saving;

  $("recordClose")

  $("photo")
    .disabled =
    saving;

  $("album")

}


function closeRecord(
  force = false
){

  if(
    isSavingRecord &&
    !force
  ){

    toast(
      "正在儲存紀錄，請稍候"
    );

    return;

  }


  recordOperationId++;


  if(
    selectedFile?.previewUrl
  ){

    URL.revokeObjectURL(
      selectedFile.previewUrl
    );

  }


  $("recordModal")
    .classList
    .remove(
      "show"
    );


  selectedFile =
    null;

  activeHour =
    null;


  $("preview")
    .innerHTML =
    "";


  $("uploadStatus")
    .classList
    .add(
      "hide"
    );


  $("uploadText")
    .textContent =
    "";


  $("progressBar")
    .style
    .width =
    "0%";


  setSavingUI(
    false
  );

}


function chooseFile(
  f
){

  if(
    isSavingRecord
  ){

    return;

  }


  if(!f){

    return;

  }


  if(
    !/^(image|video)\//.test(
      f.type
    )
  ){

    toast(
      "只支援圖片或影片"
    );

    return;

  }


  if(
    f.size >
    3 *
    1024 *
    1024
  ){

    toast(
      "免綁卡模式限制：檔案不能超過 3MB"
    );

    return;

  }


  if(
    selectedFile?.previewUrl
  ){

    URL.revokeObjectURL(
      selectedFile.previewUrl
    );

  }


  selectedFile = {

    file:
      f,

    previewUrl:
      URL.createObjectURL(
        f
      )

  };


  renderPreview(
    "",
    f.type,
    selectedFile.previewUrl
  );

}


function setUploadStatus(
  text
){

  $("uploadText")
    .textContent =
    text;

  $("uploadStatus")
    .classList
    .remove(
      "hide"
    );

}


async function saveRecord(){

  if(
    isSavingRecord
  ){

    return;

  }


  if(
    activeHour ===
      null ||
    !user ||
    !roomId
  ){

    toast(
      "目前無法儲存紀錄"
    );

    return;

  }


  const operationId =
    ++recordOperationId;

  const saveRoomId =
    roomId;

  const saveUserId =
    user.uid;

  const saveDate =
    new Date(
      currentDate
    );

  const saveDateKey =
    dateKey(
      saveDate
    );

  const saveHour =
    Number(
      activeHour
    );

  const saveFile =
    selectedFile?.file ||
    null;

  const saveText =
    $("caption")
      .value
      .trim();

  const savePath =
    `rooms/${saveRoomId}/records/${saveDateKey}/${pad(saveHour)}/${saveUserId}`;

  const old =
    room?.records?.[
      pad(saveHour)
    ]?.[
      saveUserId
    ] ||
    null;


  let media =
    old?.media ||
    null;


  try{

    setSavingUI(
      true
    );


    setUploadStatus(
      saveFile
        ? "正在轉換媒體格式..."
        : "正在儲存紀錄…"
    );


    if(
      saveFile
    ){

      if(
        saveFile.size >
        3 *
        1024 *
        1024
      ){

        throw new Error(
          "免綁卡模式限制：檔案不能超過 3MB"
        );

      }


      const base64Data =
        await new Promise(
          (resolve, reject) => {

            const reader =
              new FileReader();

            reader.onload =
              () =>
                resolve(
                  reader.result
                );

            reader.onerror =
              error =>
                reject(
                  error
                );

            reader.readAsDataURL(
              saveFile
            );

          }
        );

      media = {

        downloadURL:
          base64Data,

        contentType:
          saveFile.type,

        name:
          saveFile.name,

        size:
          saveFile.size

      };

    }


    if(
      operationId !==
      recordOperationId
    ){

      throw new Error(
        "這筆紀錄操作已取消"
      );

    }


    if(
      roomId !==
      saveRoomId ||
      !user ||
      user.uid !==
      saveUserId
    ){

      throw new Error(
        "房間或登入狀態已變更"
      );

    }


    const now =
      Date.now();


    await set(
      ref(
        db,
        savePath
      ),
      {

        date:
          saveDateKey,

        hour:
          saveHour,

        text:
          saveText,

        authorUid:
          saveUserId,

        authorName:
          localStorage.getItem(
            "momentlog_name"
          ) ||
          "我",

        savedAt:
          old?.savedAt ||
          now,

        updatedAt:
          now,

        media

      }
    );


    closeRecord(
      true
    );


    toast(
      "已同步到雲端"
    );


  }catch(error){

    console.error(
      "saveRecord:",
      error
    );


    if(
      error?.message ===
      "這筆紀錄操作已取消"
    ){

      toast(
        "紀錄儲存已取消"
      );

    }else{

      setUploadStatus(
        "儲存失敗："+friendlyError(error)
      );

      toast(
        "儲存失敗："+friendlyError(error)
      );

    }


  }finally{

    setSavingUI(
      false
    );

  }

}


async function removeMedia(){

  if(
    isSavingRecord
  ){

    return;

  }


  if(
    activeHour ===
      null ||
    !user
  ){

    return;

  }


  const saveRoomId =
    roomId;

  const saveUserId =
    user.uid;

  const saveDate =
    new Date(
      currentDate
    );

  const saveHour =
    Number(
      activeHour
    );


  const old =
    room?.records?.[
      pad(saveHour)
    ]?.[
      saveUserId
    ] ||
    null;


  if(
    !old?.media
  ){

    toast(
      "目前沒有媒體"
    );

    return;

  }


  try{

    setUploadStatus(
      "正在移除媒體…"
    );


    await set(
      ref(
        db,
        `rooms/${saveRoomId}/records/${dateKey(saveDate)}/${pad(saveHour)}/${saveUserId}`
      ),
      {

        ...old,

        media:
          null,

        updatedAt:
          Date.now()

      }
    );


    selectedFile =
      null;


    $("preview")
      .innerHTML =
      "";


    toast(
      "媒體已移除"
    );

  }catch(error){

    console.error(
      "removeMedia:",
      error
    );

    setUploadStatus(
      "移除失敗："+friendlyError(error)
    );

    toast(
      "移除失敗："+friendlyError(error)
    );

  }

}


function localNotificationsEnabled(){

    localStorage.getItem(
      "momentlog_local_notifications"
    ) ===
    "true"
  );

}


function getTaipeiNow(){

  return new Intl.DateTimeFormat(
    "en-CA",
    {
      timeZone:
        "Asia/Taipei",

      year:
        "numeric",

      month:
        "2-digit",

      day:
        "2-digit",

      hour:
        "2-digit",

      minute:
        "2-digit",

      second:
        "2-digit",

      hourCycle:
        "h23"
    }
  )
  .formatToParts(
    new Date()
  )
  .reduce(
    (obj,part) => {

      if(
        part.type !==
        "literal"
      ){

        obj[part.type] =
          part.value;

      }

      return obj;

    },
    {}
  );

}


function getNextTaipeiHour(){

  const now =
    new Date();

  const next =
    new Date(
      now.getTime() +
      60 *
      60 *
      1000
    );


  const parts =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:
          "Asia/Taipei",

        year:
          "numeric",

        month:
          "2-digit",

        day:
          "2-digit",

        hour:
          "2-digit",

        minute:
          "2-digit",

        second:
          "2-digit",

        hourCycle:
          "h23"
      }
    )
    .formatToParts(
      next
    )
    .reduce(
      (obj,part) => {

        if(
          part.type !==
          "literal"
        ){

          obj[part.type] =
            part.value;

        }

        return obj;

      },
      {}
    );


  return {

    date:
      `${parts.year}-${parts.month}-${parts.day}`,

    hour:
      Number(
        parts.hour
      )

  };

}


async function ensureNotificationServiceWorker(){

  if(
    !("serviceWorker" in navigator)
  ){

    throw new Error(
      "此瀏覽器不支援 Service Worker"
    );

  }


  const registration =
    await navigator.serviceWorker.register(
      "./firebase-messaging-sw.js",
      {
        scope:
          "./"
      }
    );


  await navigator.serviceWorker.ready;


  return registration;

}


async function registerFCMToken(){

  if(
    !user
  ){

    return null;

  }


  try{

    if(
      !(await isSupported())
    ){

      console.warn(
        "Firebase Messaging 不支援"
      );

      return null;

    }


    const registration =
      await ensureNotificationServiceWorker();


    const messaging =
      getMessaging(
        app
      );


    const token =
      await getToken(
        messaging,
        {
          vapidKey:
            VAPID_PUBLIC_KEY,

          serviceWorkerRegistration:
            registration
        }
      );


    if(
      !token
    ){

      console.warn(
        "FCM token 不存在"
      );

      return null;

    }


    const key =
      tokenKey(
        token
      );


    await set(
      ref(
        db,
        `fcmTokens/${user.uid}/${key}`
      ),
      {

        token:
          token,

        createdAt:
          Date.now(),

        updatedAt:
          Date.now()

      }
    );


    console.log(
      "MomentLog FCM token registered"
    );


    return token;

  }catch(error){

    console.warn(
      "FCM token registration failed:",
      error
    );

    return null;

  }

}


async function initForegroundMessaging(){

  if(
    messagingReady
  ){

    return;

  }


  try{

    if(

      return;

    const messaging =
      getMessaging(

    onMessage(

      payload => {

        const body =

          payload?.data?.body ||
          "該記錄了！";

}

async function getNotificationRecord(
  date,
  hour,
  uid
){

  if(
    !roomId ||
    !user ||
    user.uid !== uid
  ){

    return null;

  }


  try{

    const snapshot =
      await get(
        ref(
          db,
          `rooms/${roomId}/records/${date}/${pad(hour)}/${uid}`
        )
      );


    return snapshot.exists()
      ? snapshot.val() || null
      : null;

  }catch(error){

    console.warn(
      "getNotificationRecord:",
      error
    );

    return null;

  }

}


async function checkLocalNotification(){

  if(
    !user ||
    !roomId ||
    !room
  ){

    return;

  }


  if(
    !localNotificationsEnabled()
  ){

    return;

  }


  if(
    room?.myNotification?.enabled !==
    true
  ){

    return;

  }


  if(
    !("Notification" in window) ||
    Notification.permission !==
    "granted"
  ){

    return;

  }


  const parts =
    getTaipeiNow();

  const date =
    `${parts.year}-${parts.month}-${parts.day}`;

  const hour =
    Number(
      parts.hour
    );

  const minute =
    Number(
      parts.minute
    );

  const userId =
    user.uid;

  const currentRoomId =
    roomId;


  if(
    minute === 0
  ){

    const key =
      [
        currentRoomId,
        userId,
        date,
        String(hour),
        "hour"
      ].join("_");


    if(
      key !==
      localNotificationLastKey
    ){

      const record =
        await getNotificationRecord(
          date,
          hour,
          userId
        );


      if(
        !record
      ){

        localNotificationLastKey =
          key;


        localStorage.setItem(
          "momentlog_last_notification_key",
          key
        );


        await showLocalNotification(
          "🔔 MomentLog 提醒",

          `${room?.meta?.name || "MomentLog"}：現在 ${pad(hour)}:00，記錄一下吧！`,

          `momentlog_${key}`
        );

      }

    }

  }


  if(
    minute === 50
  ){

    const next =
      getNextTaipeiHour();


    const key =
      [
        currentRoomId,
        userId,
        next.date,
        String(
          next.hour
        ),
        "heads-up"
      ].join("_");


    if(
      key !==
      localNotificationLastKey
    ){

      const nextRecord =
        await getNotificationRecord(
          next.date,
          next.hour,
          userId
        );


      if(
        !nextRecord
      ){

        localNotificationLastKey =
          key;


        localStorage.setItem(
          "momentlog_last_notification_key",
          key
        );


        await showLocalNotification(
          "⏰ MomentLog 提醒",

          `${room?.meta?.name || "MomentLog"}：10 分鐘後 ${pad(next.hour)}:00 要記錄了`,

          `momentlog_${key}`
        );

      }

    }

  }

}


function startLocalNotificationCheck(){

  if(
    localNotificationTimer
  ){

    clearInterval(
      localNotificationTimer
    );

  }


  checkLocalNotification();


  localNotificationTimer =
    setInterval(
      checkLocalNotification,
      1000
    );

}


function stopLocalNotificationCheck(){

  if(
    localNotificationTimer
  ){

    clearInterval(
      localNotificationTimer
    );

    localNotificationTimer =
      null;

  }

}


async function toggleNotification(){

  try{

    if(
      !user ||
      !roomId
    ){

      toast(
        "請先登入並加入房間"
      );

      return;

    }


    if(
      room?.myNotification?.enabled ===
      true
    ){

      await update(
        ref(
          db,
          `rooms/${roomId}/notificationSettings/${user.uid}`
        ),
        {

          enabled:
            false,

          updatedAt:
            Date.now()

        }
      );


      localStorage.setItem(
        "momentlog_local_notifications",
        "false"
      );


      stopLocalNotificationCheck();


      renderNotify();


      toast(
        "提醒已關閉"
      );


      return;

    }


    if(
      !("Notification" in window)
    ){

      toast(
        "這個瀏覽器不支援通知"
      );

      return;

    }


    if(
      Notification.permission ===
      "denied"
    ){

      toast(
        "通知已被瀏覽器禁止，請到網站設定允許通知"
      );

      return;

    }


    let permission =
      Notification.permission;


    if(
      permission ===
      "default"
    ){

      permission =
        await Notification.requestPermission();

    }


    if(
      permission !==
      "granted"
    ){

      toast(
        "你沒有允許通知"
      );

      return;

    }


    await ensureNotificationServiceWorker();

    await registerFCMToken();


    await update(
      ref(
        db,
        `rooms/${roomId}/notificationSettings/${user.uid}`
      ),
      {

        enabled:
          true,

        minute:
          0,

        timezone:
          "Asia/Taipei",

        updatedAt:
          Date.now()

      }
    );


    localStorage.setItem(
      "momentlog_local_notifications",
      "true"
    );


    renderNotify();

    startLocalNotificationCheck();


    toast(
      "🔔 提醒已開啟"
    );

  }catch(error){

    console.error(
      "toggleNotification:",
      error
    );

    toast(
      "通知設定失敗："+friendlyError(error)
    );

  }

}

async function leaveRoom(){

  if(
    isSavingRecord
  ){

    toast(
      "正在儲存紀錄，請稍候"
    );

    return;

  }


  if(
    !user ||
    !roomId
  ){

    toast(
      "目前沒有加入房間"
    );

    return;

  }


  if(
    !confirm(
      "確定要離開這個房間嗎？房間與歷史紀錄會保留。"
    )
  ){

    return;

  }


  const id =
    roomId;

  const currentUserId =
    user.uid;

  const roomName =
    room?.meta?.name ||
    "MomentLog";


  try{

    const metaSnapshot =
      await get(
        ref(
          db,
          `rooms/${id}/meta`
        )
      );


    if(
      !metaSnapshot.exists()
    ){

      markRecentRoomLeft(
        id
      );

      leaveLocal();

      toast(
        "房間已不存在"
      );

      return;

    }


    const membersSnapshot =
      await get(
        ref(
          db,
          `rooms/${id}/members`
        )
      );


    const members =
      membersSnapshot.exists()
        ? membersSnapshot.val() ||
          {}
        : {};


    if(
      !members[currentUserId]
    ){

      markRecentRoomLeft(
        id
      );

      leaveLocal();

      toast(
        "你已經不在這個房間"
      );

      return;

    }


    await remove(
      ref(
        db,
        `rooms/${id}/notificationSettings/${currentUserId}`
      )
    ).catch(
      error =>
        console.warn(
          "notification cleanup:",
          error
        )
    );


    await remove(
      ref(
        db,
        `rooms/${id}/members/${currentUserId}`
      )
    );


    markRecentRoomLeft(
      id
    );


    leaveLocal();


    toast(
      "已離開房間，房間與歷史紀錄會保留"
    );

  }catch(error){

    console.error(
      "leaveRoom:",
      error
    );

    toast(
      "離開房間失敗："+friendlyError(error)
    );

  }

}

function showToday(){

    toast(
      "正在儲存紀錄，請稍候"

    return;

  currentDate =

function changeDate(
  offset
){

  if(
    isSavingRecord
  ){

    toast(
      "正在儲存紀錄，請稍候"
    );

    return;

  }


  const next =
    addDays(
      currentDate,
      offset
    );


  if(
    dateKey(next) >
    dateKey(new Date())
  ){

    return;

  }


  currentDate =
    next;


  followToday =
    isToday(
      next
    );


  lastRenderedHour =
    null;


  loadRecordsListener();

  render();

}

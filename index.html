<!doctype html>
<html lang="zh-Hant" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7fb">
<meta name="description" content="MomentLog - 一起記錄每個時刻">
<meta name="google" content="notranslate">
<link rel="manifest" href="./manifest.webmanifest">
<title>MomentLog</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --bg:linear-gradient(135deg,#eef2ff,#f8fafc);
  --text:#172033;
  --muted:#718096;
  --border:#e6eaf0;
  --card:#fff;
  --primary:#4f46e5
}

html,body{
  margin:0;
  min-height:100%;
  background:#f8fafc
}

body{
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color:var(--text);
  background:var(--bg);
  transition:.25s
}

body.dark{
  --text:#e5e7eb;
  --muted:#94a3b8;
  --border:#334155;
  --card:#172033;
  background:#0f172a
}

body.dark .card,
body.dark .btn,
body.dark .field input,
body.dark .field textarea,
body.dark .field select,
body.dark .slotBox,
body.dark .member,
body.dark .stat,
body.dark .modalCard,
body.dark .status{
  background:#172033;
  color:#e5e7eb;
  border-color:#334155
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.hide{display:none!important}

.app{
  width:min(1160px,100%);
  margin:auto;
  padding:16px 16px 90px
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:14px
}

.brand{
  display:flex;
  gap:10px;
  align-items:center
}

.icon{
  width:45px;
  height:45px;
  border-radius:14px;
  background:#111827;
  color:#fff;
  display:grid;
  place-items:center;
  font-size:22px;
  flex:none
}

.brand h1{
  margin:0;
  font-size:21px
}

.brand small,
.muted{
  color:var(--muted)
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:flex-end
}

.btn{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:12px;
  padding:10px 13px;
  min-height:40px
}

.btn.primary{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary)
}

.btn.danger{
  background:#fee2e2;
  color:#dc2626;
  border-color:#fecaca
}

.btn.active{
  background:#dcfce7;
  color:#166534;
  border-color:#86efac
}

.card{
  background:rgba(255,255,255,.96);
  border-radius:20px;
  box-shadow:0 14px 38px rgba(15,23,42,.08)
}

.setup{
  max-width:560px;
  margin:7vh auto;
  padding:28px
}

.setup h2{
  margin:0 0 8px
}

.setup p{
  line-height:1.7;
  color:var(--muted)
}

.field{
  margin:12px 0
}

.field label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:6px
}

.field input,
.field textarea,
.field select{
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--card);
  color:var(--text);
  outline:none
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:#818cf8;
  box-shadow:0 0 0 3px rgba(99,102,241,.1)
}

.setupActions{
  display:grid;
  gap:8px;
  margin-top:14px
}

.privacy{
  margin-top:10px;
  color:var(--muted);
  font-size:12px;
  line-height:1.6
}

.account{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border:1px solid var(--border);
  border-radius:13px;
  background:#f8fafc;
  margin-top:12px
}

.accountAvatar{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
  background:#e0e7ff;
  flex:none
}

.accountInfo{
  min-width:0;
  flex:1
}

.accountName{
  font-weight:800;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.accountEmail{
  font-size:12px;
  color:var(--muted);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.hero{
  padding:18px;
  margin-bottom:14px
}

.heroRow{
  display:flex;
  justify-content:space-between;
  gap:10px
}

.hero h2{
  margin:0;
  font-size:24px
}

.clock{
  font-size:25px;
  font-weight:800;
  text-align:right
}

.next{
  font-size:12px;
  color:var(--muted);
  text-align:right;
  margin-top:2px
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:14px
}

.stat{
  padding:12px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--card)
}

.statTitle{
  font-size:12px;
  color:var(--muted)
}

.statValue{
  font-size:18px;
  font-weight:800;
  margin-top:4px;
  word-break:break-word
}

.grid{
  display:grid;
  grid-template-columns:280px 1fr;
  gap:14px
}

.side{
  padding:15px;
  position:sticky;
  top:12px;
  align-self:start
}

.sideTitle{
  font-weight:800;
  margin-bottom:10px
}

.members{
  display:grid;
  gap:8px
}

.member{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center;
  border:1px solid var(--border);
  border-radius:12px;
  padding:9px;
  background:var(--card)
}

.memberName{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.memberRight{
  display:flex;
  gap:5px;
  align-items:center;
  flex:none
}

.badge{
  padding:5px 8px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap
}

.badge.done{
  background:#dcfce7;
  color:#166534
}

.badge.wait{
  background:#fef3c7;
  color:#92400e
}

.badge.owner{
  background:#e0e7ff;
  color:#3730a3
}

.sideButtons{
  display:grid;
  gap:8px;
  margin-top:14px
}

.timeline{
  padding:16px;
  min-width:0
}

.timelineHead{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin-bottom:12px
}

.timelineHead h3{
  margin:0
}

.slots{
  display:grid;
  gap:10px
}

.emptyTimeline{
  padding:28px 15px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--border);
  border-radius:14px;
  background:#f8fafc
}

.slot{
  display:grid;
  grid-template-columns:60px 1fr;
  gap:8px
}

.time{
  font-size:12px;
  font-weight:800;
  color:var(--muted);
  text-align:right;
  padding-top:11px
}

.slotBox{
  border:1px solid var(--border);
  border-radius:14px;
  padding:11px;
  background:var(--card)
}

.slotTitle{
  display:flex;
  justify-content:space-between;
  gap:8px
}

.pill{
  display:inline-flex;
  margin-top:8px;
  padding:6px 9px;
  border-radius:9px;
  font-size:12px;
  font-weight:800
}

.pill.done{
  background:#dcfce7;
  color:#166534
}

.caption{
  margin-top:8px;
  line-height:1.65;
  white-space:pre-wrap;
  word-break:break-word
}

.media{
  margin-top:9px;
  border-radius:11px;
  overflow:hidden;
  background:#111827
}

.media img,
.media video{
  display:block;
  width:100%;
  max-height:500px;
  object-fit:contain
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.56);
  display:none;
  align-items:center;
  justify-content:center;
  padding:12px;
  z-index:1000
}

.modal.show{
  display:flex
}

.modalCard{
  width:min(620px,100%);
  background:var(--card);
  color:var(--text);
  border-radius:20px;
  padding:17px;
  max-height:90vh;
  overflow:auto
}

.modalHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px
}

.close{
  width:38px;
  height:38px;
  border:1px solid var(--border);
  border-radius:50%;
  background:var(--card);
  color:var(--text)
}

.mediaBtns{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px
}

.hidden{
  display:none
}

.modalActions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:14px
}

.themeGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px
}

.themeOpt{
  border:2px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:12px;
  padding:8px;
  text-align:left
}

.themeOpt.selected{
  border-color:var(--primary)
}

.swatch{
  height:48px;
  border-radius:9px;
  margin-bottom:6px
}

.progress{
  height:8px;
  border-radius:999px;
  background:#e5e7eb;
  overflow:hidden;
  margin-top:8px
}

.progressBar{
  height:100%;
  width:0;
  background:var(--primary);
  transition:.2s
}

.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  z-index:3000;
  display:none;
  background:#111827;
  color:#fff;
  padding:10px 14px;
  border-radius:999px;
  font-size:13px;
  max-width:calc(100vw - 30px);
  text-align:center
}

@media(max-width:820px){
  .grid{grid-template-columns:1fr}
  .side{position:static}
  .heroRow{flex-direction:column}
  .clock,.next{text-align:left}
}

@media(max-width:580px){
  .stats{grid-template-columns:1fr 1fr}
  .actions{display:grid;grid-template-columns:1fr 1fr}
  .mediaBtns{grid-template-columns:1fr 1fr}
  .themeGrid{grid-template-columns:1fr}
  .slot{grid-template-columns:52px 1fr}
  .modalActions{display:grid;grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<div class="app">

<section id="setup" class="setup card">

  <div class="icon">⏱️</div>

  <h2>MomentLog</h2>

  <p>
    Google 登入、多人房間、即時同步，一起記錄每個時刻。
  </p>

  <div id="loginArea">

    <button id="googleLogin" class="btn primary">
      🔐 使用 Google 帳號登入
    </button>

    <div class="privacy">
      Google 帳號只用於 Firebase 身分驗證。
      房間內顯示的是你的 MomentLog 自訂暱稱。
    </div>

  </div>

  <div id="profileArea" class="hide">

    <div class="account">

      <img
        id="accountAvatar"
        class="accountAvatar"
        alt=""
      >

      <div class="accountInfo">

        <div
          id="accountName"
          class="accountName"
        ></div>

        <div
          id="accountEmail"
          class="accountEmail"
        ></div>

      </div>

      <button id="logout" class="btn">
        登出
      </button>

    </div>

    <div class="field">

      <label for="name">
        你的暱稱
      </label>

      <input
        id="name"
        maxlength="30"
        placeholder="例如：小明"
        autocomplete="nickname"
        translate="no"
      >

    </div>

    <div class="field">

      <label for="log">
        Log 名稱
      </label>

      <input
        id="log"
        maxlength="60"
        placeholder="例如：我們的暑假"
        autocomplete="off"
        translate="no"
      >

    </div>

    <div class="setupActions">

      <button id="saveProfile" class="btn">
        保存個人資料
      </button>

      <button id="create" class="btn primary">
        建立新房間
      </button>

    </div>

    <hr style="border:0;border-top:1px solid var(--border);margin:18px 0">

    <div class="field">

      <label for="joinCode">
        加入房間碼
      </label>

      <input
        id="joinCode"
        maxlength="12"
        placeholder="例如 ABCD1234"
        autocomplete="off"
        translate="no"
      >

    </div>

    <button id="join" class="btn">
      加入房間
    </button>

  </div>

  <div
    id="setupStatus"
    class="muted"
    style="font-size:13px;margin-top:10px"
  >
    請先登入 Google 帳號
  </div>

</section>


<section id="room" class="hide">

<header class="top">

  <div class="brand">

    <div class="icon">
      ⏱️
    </div>

    <div>

      <h1>MomentLog</h1>

      <small>
        一起記錄每個時刻
      </small>

    </div>

  </div>

  <div class="actions">

    <button id="notify" class="btn">
      🔕 通知：關閉
    </button>

    <button id="theme" class="btn">
      🎨 主題
    </button>

    <button id="invite" class="btn">
      邀請
    </button>

    <button id="leave" class="btn danger">
      離開房間
    </button>

  </div>

</header>


<section class="hero card">

  <div class="heroRow">

    <div>

      <h2 id="title">
        MomentLog
      </h2>

      <div id="sub" class="muted"></div>

    </div>

    <div>

      <div id="clock" class="clock">
        00:00:00
      </div>

      <div id="next" class="next"></div>

    </div>

  </div>

  <div class="stats">

    <div class="stat">

      <div class="statTitle">
        已到時段
      </div>

      <div
        id="available"
        class="statValue"
      >
        0
      </div>

    </div>

    <div class="stat">

      <div
        id="doneLabel"
        class="statTitle"
      >
        今日已完成
      </div>

      <div
        id="doneCount"
        class="statValue"
      >
        0
      </div>

    </div>

    <div class="stat">

      <div class="statTitle">
        房間碼
      </div>

      <div
        id="roomCode"
        class="statValue"
      ></div>

    </div>

  </div>

</section>


<main class="grid">

<aside class="side card">

  <div class="sideTitle">
    房間成員
  </div>

  <div
    id="members"
    class="members"
  ></div>

  <div class="sideButtons">

    <button
      id="now"
      class="btn primary"
    >
      📍 記錄現在
    </button>

    <button
      id="yesterday"
      class="btn"
    >
      查看昨天
    </button>

    <button
      id="today"
      class="btn hide"
    >
      ↩ 返回今天
    </button>

    <button
      id="prevDate"
      class="btn"
    >
      ◀ 前一天
    </button>

    <button
      id="nextDate"
      class="btn"
    >
      下一天 ▶
    </button>

  </div>

</aside>


<section class="timeline card">

  <div class="timelineHead">

    <div>

      <h3>
        時間軸
      </h3>

      <div
        id="dateLabel"
        class="muted"
        style="font-size:13px;margin-top:4px"
      ></div>

    </div>

  </div>

  <div
    id="slots"
    class="slots"
  ></div>

</section>

</main>

</section>

</div>


<div
  id="recordModal"
  class="modal"
>

<div class="modalCard">

  <div class="modalHead">

    <div>

      <h3>
        記錄這個時刻
      </h3>

      <div
        id="recordWhen"
        class="muted"
      ></div>

    </div>

    <button
      id="recordClose"
      class="close"
    >
      ×
    </button>

  </div>

  <div class="field">

    <label for="caption">
      內容
    </label>

    <textarea
      id="caption"
      maxlength="3000"
      rows="6"
      placeholder="寫下這一刻發生了什麼…"
      translate="no"
    ></textarea>

  </div>

  <div class="mediaBtns">

    <button
      id="photo"
      class="btn"
    >
      📷 拍照
    </button>

    <button
      id="video"
      class="btn"
    >
      🎥 錄影
    </button>

    <button
      id="album"
      class="btn"
    >
      🖼️ 相簿
    </button>

    <button
      id="remove"
      class="btn danger"
    >
      🗑️ 移除媒體
    </button>

  </div>

  <input
    id="photoInput"
    class="hidden"
    type="file"
    accept="image/*"
    capture="environment"
  >

  <input
    id="videoInput"
    class="hidden"
    type="file"
    accept="video/*"
    capture="environment"
  >

  <input
    id="albumInput"
    class="hidden"
    type="file"
    accept="image/*,video/*"
  >

  <div id="preview"></div>

  <div
    id="uploadStatus"
    class="status hide"
  >

    <div id="uploadText"></div>

    <div class="progress">

      <div
        id="progressBar"
        class="progressBar"
      ></div>

    </div>

  </div>

  <div class="modalActions">

    <button
      id="cancelRecord"
      class="btn"
    >
      取消
    </button>

    <button
      id="saveRecord"
      class="btn primary"
    >
      儲存
    </button>

  </div>

</div>

</div>


<div
  id="themeModal"
  class="modal"
>

<div class="modalCard">

  <div class="modalHead">

    <h3>
      🎨 背景主題
    </h3>

    <button
      id="themeClose"
      class="close"
    >
      ×
    </button>

  </div>

  <div class="themeGrid">

    <button
      class="themeOpt"
      data-theme="default"
    >
      <div
        class="swatch"
        style="background:linear-gradient(135deg,#eef2ff,#f8fafc)"
      ></div>
      🌤️ 預設
    </button>

    <button
      class="themeOpt"
      data-theme="blue"
    >
      <div
        class="swatch"
        style="background:linear-gradient(135deg,#dbeafe,#eff6ff)"
      ></div>
      🌊 藍色
    </button>

    <button
      class="themeOpt"
      data-theme="green"
    >
      <div
        class="swatch"
        style="background:linear-gradient(135deg,#dcfce7,#f0fdf4)"
      ></div>
      🌿 綠色
    </button>

    <button
      class="themeOpt"
      data-theme="pink"
    >
      <div
        class="swatch"
        style="background:linear-gradient(135deg,#fce7f3,#fff1f2)"
      ></div>
      🌸 粉色
    </button>

    <button
      class="themeOpt"
      data-theme="purple"
    >
      <div
        class="swatch"
        style="background:linear-gradient(135deg,#ede9fe,#f5f3ff)"
      ></div>
      💜 紫色
    </button>

    <button
      class="themeOpt"
      data-theme="sunset"
    >
      <div
        class="swatch"
        style="background:linear-gradient(135deg,#ffedd5,#fef3c7)"
      ></div>
      🌅 日落
    </button>

    <button
      class="themeOpt"
      data-theme="dark"
    >
      <div
        class="swatch"
        style="background:linear-gradient(135deg,#1e293b,#0f172a)"
      ></div>
      🌌 黑暗
    </button>

  </div>

</div>

</div>


<div
  id="toast"
  class="toast"
></div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  get,
  set,
  update,
  remove,
  onValue,
  runTransaction
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";

import {
  getStorage,
  ref as storageRef,
  uploadBytesResumable,
  getDownloadURL,
  deleteObject
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-storage.js";

import {
  getMessaging,
  getToken,
  isSupported,
  onMessage
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-messaging.js";

import firebaseConfig from "./firebase-config.js";


const VAPID_PUBLIC_KEY =
"BN4k0ivU8J1bzyVlUncMDqgJnQKpzO33wwOJW4PbKvjGBHhBlc74bo_LmRw6lfsjREcjqH5YUfmCBMegeMMr83c";


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getDatabase(app);

const storage =
  getStorage(app);

const googleProvider =
  new GoogleAuthProvider();

const $ =
  id =>
    document.getElementById(id);


const themes = {

  default:
    "linear-gradient(135deg,#eef2ff,#f8fafc)",

  blue:
    "linear-gradient(135deg,#dbeafe,#eff6ff)",

  green:
    "linear-gradient(135deg,#dcfce7,#f0fdf4)",

  pink:
    "linear-gradient(135deg,#fce7f3,#fff1f2)",

  purple:
    "linear-gradient(135deg,#ede9fe,#f5f3ff)",

};


const pad =
  n =>
    String(n).padStart(2,"0");


const taipeiParts =
  date =>
    new Intl.DateTimeFormat(
      "zh-TW",
      {
        timeZone:"Asia/Taipei",
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hourCycle:"h23"
      }
    )
    .formatToParts(date)
    .reduce(
      (obj,part) => {

        obj[part.type] =
          part.value;

        return obj;

      },
      {}
    );


const dateKey =
  date => {

    const p =
      taipeiParts(date);

    return (
      `${p.year}-${p.month}-${p.day}`
    );

  };


const addDays =
  (date,amount) => {

    const result =
      new Date(date);

    result.setDate(
      result.getDate() +
      amount
    );

    return result;

  };


const isToday =
  date =>
    dateKey(date) ===
    dateKey(new Date());


const escapeHtml =
  value =>
    String(value ?? "")
      .replace(
        /[&<>"']/g,
        match =>
          ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
          })[match]
      );


const safeFileName =
  value =>
    String(
      value || "file"
    )
    .replace(
      /[^a-zA-Z0-9._-]/g,
      "_"
    )
    .slice(
      0,
      120
    );


const tokenKey =
  token => {

    const bytes =
      new TextEncoder()
        .encode(token);

    let output = "";

    bytes.forEach(
      byte => {

        output +=
          String.fromCharCode(
            byte
          );

      }
    );

    return btoa(output)
      .replace(/\+/g,"-")
      .replace(/\//g,"_")
      .replace(/=+$/,"");

  };

function toast(message){

  const element =
    $("toast");

  element.textContent =
    message;

  element.style.display =
    "block";

  clearTimeout(
    window.__momentToast
  );

  window.__momentToast =
    setTimeout(
      () => {

        element.style.display =
          "none";

      },
      2800
    );

}


function showSetupStatus(message){

  $("setupStatus")
    .textContent =
    message;

}


function applyTheme(){

  const theme =
    localStorage.getItem(
      "momentlog_theme"
    ) || "default";


  document.documentElement
    .style
    .setProperty(
      "--bg",
      themes[theme] ||
      themes.default
    );


  document.body
    .classList
    .toggle(
      "dark",
      theme === "dark"
    );


  document
    .querySelectorAll(
      ".themeOpt"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "selected",
          button.dataset.theme ===
          theme
        );

      }
    );

}


function friendlyError(error){

  const code =
    error?.code || "";


  if(
    code.includes(
      "permission-denied"
    ) ||
    code ===
    "PERMISSION_DENIED"
  ){

    return(
      "Firebase 權限被拒絕，請檢查 Realtime Database Rules"
    );

  }


  if(
    code.includes(
      "storage/unauthorized"
    )
  ){

    return(
      "Storage 權限被拒絕，請檢查 Storage Rules"
    );

  }


  if(
    code.includes(
      "storage/bucket-not-found"
    )
  ){

    return(
      "Storage 尚未建立"
    );

  }


  if(
    code ===
    "auth/unauthorized-domain"
  ){

    return(
      "目前網站網域尚未加入 Firebase Authentication 授權網域"
    );

  }


  if(
    code ===
    "auth/operation-not-allowed"
  ){

    return(
      "Firebase 尚未啟用 Google 登入"
    );

  }


  if(
    code ===
    "auth/popup-blocked"
  ){

    return(
      "瀏覽器阻擋 Google 登入視窗"
    );

  }


  if(
    code ===
    "auth/popup-closed-by-user"
  ){

    return(
      "你關閉了 Google 登入視窗"
    );

  }


  return(
    error?.message ||
    "未知錯誤"
  );

}


function memberPath(
  uid,
  id = roomId
){

  return `
    rooms/${id}/members/${uid}
  `.replace(
    /\s+/g,
    ""
  );

}


function recordPath(
  date,
  hour,
  uid,
  id = roomId
){

  return `
    rooms/${id}/records/${dateKey(date)}/${pad(hour)}/${uid}
  `.replace(
    /\s+/g,
    ""
  );

}


function isOwner(){

  return Boolean(
    user &&
    room?.meta?.ownerUid ===
    user.uid
  );

}


function clearListeners(){

  [
    unsubMeta,
    unsubMembers,
    unsubSettings,
    unsubRecords
  ]
  .forEach(
    unsubscribe => {

      try{
        unsubscribe?.();
      }catch{}

    }
  );


  unsubMeta = null;
  unsubMembers = null;
  unsubSettings = null;
  unsubRecords = null;

}

async function loadProfile(){

  if(!user){
    return;
  }


  try{

    const snapshot =
      await get(
        ref(
          db,
          `users/${user.uid}`
        )
      );


    room =
      room || {};


    room.profile =
      snapshot.exists()
        ? snapshot.val() || {}
        : {};

  }catch(error){

    console.warn(
      "loadProfile:",
      error
    );


    room =
      room || {};


    room.profile =
      {};

  }


  const savedName =
    room.profile?.displayName ||
    localStorage.getItem(
      "momentlog_name"
    ) ||
    "";


  $("name").value =
    savedName;

}


async function saveProfile(){

  if(!user){

    toast(
      "請先登入 Google 帳號"
    );

    return false;

  }


  const name =
    $("name")
      .value
      .trim();


  if(!name){

    toast(
      "請輸入暱稱"
    );

    $("name").focus();

    return false;

  }


  if(
    name.length > 30
  ){

    toast(
      "暱稱最多 30 個字"
    );

    return false;

  }


  try{

    const now =
      Date.now();


    await set(
      ref(
        db,
        `users/${user.uid}`
      ),
      {
        displayName:name,
        updatedAt:now
      }
    );


    if(
      room?.members?.[user.uid]
    ){

      await update(
        ref(
          db,
          memberPath(
            user.uid
          )
        ),
        {
          displayName:name,
          updatedAt:now
        }
      );

    }


    room =
      room || {};


    room.profile = {
      ...(room.profile || {}),
      displayName:name,
      updatedAt:now
    };


    localStorage.setItem(
      "momentlog_name",
      name
    );


    toast(
      "個人資料已保存"
    );


    return true;


  }catch(error){

    console.error(
      "saveProfile:",
      error
    );


    toast(
      "保存個人資料失敗："+friendlyError(error)
    );


    return false;

  }

}

async function createRoom(){

  if(!user){

    toast(
      "請先登入 Google 帳號"
    );

    return;

  }


  const name =
    $("name")
      .value
      .trim();


  const log =
    $("log")
      .value
      .trim();


  if(!name){

    toast(
      "請輸入暱稱"
    );

    $("name").focus();

    return;

  }


  if(!log){

    toast(
      "請輸入 Log 名稱"
    );

    $("log").focus();

    return;

  }


  if(
    !(await saveProfile())
  ){

    return;

  }


  try{

    let id = "";


    for(
      let i = 0;
      i < 8 &&
      !id;
      i++
    ){

      const candidate =
        crypto
          .randomUUID()
          .replace(
            /-/g,
            ""
          )
          .slice(
            0,
            8
          )
          .toUpperCase();


      const transaction =
        await runTransaction(
          ref(
            db,
            `rooms/${candidate}/meta`
          ),
          current => {

            if(
              current !== null
            ){

              return;

            }


            return {

              roomId:
                candidate,

              name:
                log,

              ownerUid:
                user.uid,

              createdAt:
                Date.now(),

              updatedAt:
                Date.now()

            };

          }
        );


      if(
        transaction.committed
      ){

        id =
          candidate;

      }

    }


    if(!id){

      throw new Error(
        "房間碼建立失敗"
      );

    }


    await set(
      ref(
        db,
        memberPath(
          user.uid,
          id
        )
      ),
      {

        displayName:
          name,

        joinedAt:
          Date.now(),

        updatedAt:
          Date.now()

      }
    );


    localStorage.setItem(
      "momentlog_room",
      id
    );


    localStorage.setItem(
      "momentlog_name",
      name
    );


    roomId =
      id;


    currentDate =
      new Date();


    connectRoom();


    toast(
      "房間建立成功"
    );


  }catch(error){

    console.error(
      "createRoom:",
      error
    );


    toast(
      "建立房間失敗："+friendlyError(error)
    );

  }

}


async function joinRoom(){

  if(!user){

    toast(
      "請先登入 Google 帳號"
    );

    return;

  }


  const name =
    $("name")
      .value
      .trim();


  const id =
    $("joinCode")
      .value
      .trim()
      .toUpperCase();


  if(!name){

    toast(
      "請輸入暱稱"
    );

    $("name").focus();

    return;

  }


  if(
    !/^[A-Z0-9]{8,12}$/.test(
      id
    )
  ){

    toast(
      "房間碼格式不正確"
    );

    return;

  }


  try{

    const meta =
      await get(
        ref(
          db,
          `rooms/${id}/meta`
        )
      );


    if(
      !meta.exists()
    ){

      toast(
        "找不到這個房間"
      );

      return;

    }


    const now =
      Date.now();


    await set(
      ref(
        db,
        memberPath(
          user.uid,
          id
        )
      ),
      {

        displayName:
          name,

        joinedAt:
          now,

        updatedAt:
          now

      }
    );


    try{

      await update(
        ref(
          db,
          `users/${user.uid}`
        ),
        {
          displayName:name,
          updatedAt:now
        }
      );

    }catch(error){

      console.warn(
        "profile update:",
        error
      );

    }


    localStorage.setItem(
      "momentlog_room",
      id
    );


    localStorage.setItem(
      "momentlog_name",
      name
    );


    roomId =
      id;


    currentDate =
      new Date();


    connectRoom();


    toast(
      "已加入房間"
    );


  }catch(error){

    console.error(
      "joinRoom:",
      error
    );


    toast(
      "加入房間失敗："+friendlyError(error)
    );

  }

}


function connectRoom(){

  clearListeners();


  if(
    !roomId ||
    !user
  ){

    return;

  }


  room =
    room || {};


  unsubMeta =
    onValue(
      ref(
        db,
        `rooms/${roomId}/meta`
      ),
      snapshot => {

        if(
          !snapshot.exists()
        ){

          clearListeners();

          room = null;

          roomId = "";

          localStorage.removeItem(
            "momentlog_room"
          );


          $("room")
            .classList
            .add("hide");


          $("setup")
            .classList
            .remove("hide");


          toast(
            "房間不存在或已被關閉"
          );

          return;

        }


        room.meta =
          snapshot.val() || {};


        render();

      },
      error => {

        console.error(
          "meta listener:",
          error
        );


        toast(
          "房間資料讀取失敗："+friendlyError(error)
        );

      }
    );


  unsubMembers =
    onValue(
      ref(
        db,
        `rooms/${roomId}/members`
      ),
      snapshot => {

        room.members =
          snapshot.val() || {};


        if(
          !room.members[user.uid]
        ){

          clearListeners();

          room = null;

          roomId = "";

          localStorage.removeItem(
            "momentlog_room"
          );


          $("room")
            .classList
            .add("hide");


          $("setup")
            .classList
            .remove("hide");


          toast(
            "你已離開這個房間"
          );

          return;

        }


        loadRecordsListener();

        render();

      },
      error => {

        console.error(
          "members listener:",
          error
        );


        toast(
          "成員資料讀取失敗："+friendlyError(error)
        );

      }
    );


  unsubSettings =
    onValue(
      ref(
        db,
        `
          rooms/${roomId}/
          notificationSettings/${user.uid}
        `.replace(
          /\s+/g,
          ""
        )
      ),
      snapshot => {

        room.myNotification =
          snapshot.val() || {};


        renderNotify();

      },
      error => {

        console.warn(
          "notification listener:",
          error
        );

      }
    );

}


function loadRecordsListener(){

  if(
    unsubRecords
  ){

    try{
      unsubRecords();
    }catch{}

    unsubRecords =
      null;

  }


  if(
    !roomId ||
    !user ||
    !room?.members?.[user.uid]
  ){

    return;

  }


  const targetDate =
    dateKey(
      currentDate
    );


  unsubRecords =
    onValue(
      ref(
        db,
        `
          rooms/${roomId}/
          records/${targetDate}
        `.replace(
          /\s+/g,
          ""
        )
      ),
      snapshot => {

        room.records =
          snapshot.val() || {};


        render();

      },
      error => {

        console.error(
          "records listener:",
          error
        );


        toast(
          "紀錄讀取失敗："+friendlyError(error)
        );

      }
    );

}


function render(){

  if(
    !room?.meta ||
    !user
  ){

    return;

  }


  $("setup")
    .classList
    .add("hide");


  $("room")
    .classList
    .remove("hide");


  $("title")
    .textContent =
    room.meta.name ||
    "MomentLog";


  $("roomCode")
    .textContent =
    roomId;


  $("sub")
    .textContent =
    `${dateKey(currentDate)} · 房間碼 ${roomId}`;


  const now =
    new Date();


  const p =
    taipeiParts(now);


  $("clock")
    .textContent =
    `${p.hour}:${p.minute}:${p.second}`;


  const all =
    room.records || {};


  const entries = [];


  /*
   * 今天只顯示已經結束的整點。
   *
   * 21:00～21:59
   * → 最後顯示 20:00
   */

  const maxHour =
    isToday(currentDate)
      ? Number(p.hour) - 1
      : 23;


  for(
    let hour = 0;
    hour <= maxHour;
    hour++
  ){

    entries.push(
      [
        hour,
        all[
          pad(hour)
        ] || {}
      ]
    );

  }


  $("available")
    .textContent =
    String(
      entries.length
    );


  $("doneCount")
    .textContent =
    String(
      entries.reduce(
        (count,[,users]) =>
          count +
          (
            users?.[user.uid]
              ? 1
              : 0
          ),
        0
      )
    );


  $("doneLabel")
    .textContent =
    isToday(currentDate)
      ? "今日已完成"
      : "當日已完成";


  $("dateLabel")
    .textContent =
    isToday(currentDate)
      ? "今天"
      : `歷史日期：${dateKey(currentDate)}`;


  $("yesterday")
    .classList
    .toggle(
      "hide",
      !isToday(currentDate)
    );


  $("today")
    .classList
    .toggle(
      "hide",
      isToday(currentDate)
    );


  if(
    isToday(currentDate)
  ){

    const next =
      new Date(now);


    next.setSeconds(
      0,
      0
    );


    next.setMinutes(
      0,
      0
    );


    next.setHours(
      next.getHours()+1
    );


    const np =
      taipeiParts(next);


    $("next")
      .textContent =
      `下一個紀錄點 ${np.hour}:00`;

  }else{

    $("next")
      .textContent =
      "正在查看歷史紀錄";

  }


  renderMembers();

  renderTimeline(
    entries
  );

  renderNotify();

  renderAccount();

  applyTheme();

}


function renderMembers(){

  const members =
    room.members || {};

  const records =
    room.records || {};

  const ownerUid =
    room.meta?.ownerUid;


  $("members")
    .innerHTML =
    Object.entries(
      members
    )
    .map(
      ([uid,member]) => {

        const completed =
          Object.values(
            records
          )
          .some(
            slot =>
              Boolean(
                slot?.[uid]
              )
          );


        const isRoomOwner =
          uid === ownerUid;


        return `
          <div class="member">

            <span class="memberName">
              👤
              ${escapeHtml(
                member?.displayName ||
                "未命名"
              )}
            </span>

            <span class="memberRight">

              ${
                isRoomOwner
                  ? `
                    <span class="badge owner">
                      房主
                    </span>
                  `
                  : ""
              }

              <span class="badge ${
                completed
                  ? "done"
                  : "wait"
              }">

                ${
                  completed
                    ? "已完成"
                    : "等待中"
                }

              </span>

            </span>

          </div>
        `;

      }
    )
    .join("")
    ||
    "<div class='muted'>沒有成員</div>";

}


function renderTimeline(entries){

  if(
    !entries.length
  ){

    $("slots")
      .innerHTML =
      `
        <div class="emptyTimeline">
          今天還沒有已到達的紀錄點。
          <br>
          可以使用「📍 記錄現在」記錄目前時刻。
        </div>
      `;

    return;

  }


  $("slots")
    .innerHTML =
    entries
      .map(
        ([hour,users]) => {

          const mine =
            users?.[user.uid] ||
            null;


          let media = "";


          if(
            mine?.media?.downloadURL
          ){

            const type =
              mine.media.contentType ||
              "";


            if(
              type.startsWith(
                "image/"
              )
            ){

              media =
              `
                <div class="media">

                  <img
                    src="${escapeHtml(
                      mine.media.downloadURL
                    )}"
                    alt="圖片"
                    loading="lazy"
                  >

                </div>
              `;

            }else if(
              type.startsWith(
                "video/"
              )
            ){

              media =
              `
                <div class="media">

                  <video
                    src="${escapeHtml(
                      mine.media.downloadURL
                    )}"
                    controls
                    playsinline
                    preload="metadata"
                  ></video>

                </div>
              `;

            }

          }


          return `
            <div class="slot">

              <div class="time">
                ${pad(hour)}:00
              </div>

              <div class="slotBox">

                <div class="slotTitle">

                  <b>
                    ${
                      mine
                        ? "📌 已記錄"
                        : "尚未紀錄"
                    }
                  </b>

                </div>

                ${
                  mine
                    ? `
                      <div class="pill done">
                        ✅ 你已完成
                      </div>
                    `
                    : ""
                }

                ${
                  mine?.text
                    ? `
                      <div class="caption">
                        ${escapeHtml(
                          mine.text
                        )}
                      </div>
                    `
                    : ""
                }

                ${media}

                <div style="margin-top:9px">

                  <button
                    class="btn ${
                      mine
                        ? "primary"
                        : ""
                    }"
                    data-hour="${hour}"
                  >
                    ${
                      mine
                        ? "編輯紀錄"
                        : "立即紀錄"
                    }
                  </button>

                </div>

              </div>

            </div>
          `;

        }
      )
      .join("");


  document
    .querySelectorAll(
      "[data-hour]"
    )
    .forEach(
      button => {

        button.onclick =
          () => {

            openRecord(
              Number(
                button.dataset.hour
              )
            );

          };

      }
    );

}


function openRecord(hour){

  if(
    !user ||
    !roomId
  ){

    toast(
      "請先登入並加入房間"
    );

    return;

  }


  activeHour =
    hour;


  selectedFile =
    null;


  const mine =
    room?.records?.[
      pad(hour)
    ]?.[user.uid] ||
    null;


  $("recordWhen")
    .textContent =
    `${dateKey(currentDate)} · ${pad(hour)}:00`;


  $("caption")
    .value =
    mine?.text ||
    "";


  $("uploadStatus")
    .classList
    .add("hide");


  $("uploadText")
    .textContent =
    "";


  $("progressBar")
    .style
    .width =
    "0%";


  renderPreview(
    mine?.media
  );


  $("recordModal")
    .classList
    .add("show");

}


function renderPreview(media){

  if(
    !media?.downloadURL
  ){

    $("preview")
      .innerHTML =
      "";

    return;

  }


  const type =
    media.contentType ||
    "";


  if(
    type.startsWith(
      "image/"
    )
  ){

    $("preview")
      .innerHTML =
      `
        <div class="media">

          <img
            src="${escapeHtml(
              media.downloadURL
            )}"
            alt="預覽"
          >

        </div>
      `;

  }else{

    $("preview")
      .innerHTML =
      `
        <div class="media">

          <video
            src="${escapeHtml(
              media.downloadURL
            )}"
            controls
            playsinline
          ></video>

        </div>
      `;

  }

}


function closeRecord(){

  if(
    selectedFile?.previewUrl
  ){

    URL.revokeObjectURL(
      selectedFile.previewUrl
    );

  }


  selectedFile =
    null;


  activeHour =
    null;


  $("recordModal")
    .classList
    .remove("show");


  $("preview")
    .innerHTML =
    "";


  $("uploadStatus")
    .classList
    .add("hide");


  $("uploadText")
    .textContent =
    "";


  $("progressBar")
    .style
    .width =
    "0%";

}


function chooseFile(file){

  if(!file){
    return;
  }


  if(
    !/^(image|video)\//
      .test(
        file.type
      )
  ){

    toast(
      "只支援圖片或影片"
    );

    return;

  }


  if(
    file.size >
    250 * 1024 * 1024
  ){

    toast(
      "單檔不能超過 250MB"
    );

    return;

  }


  if(
    selectedFile?.previewUrl
  ){

    URL.revokeObjectURL(
      selectedFile.previewUrl
    );

  }


  selectedFile = {

    file,

    previewUrl:
      URL.createObjectURL(
        file
      )

  };


  renderPreview({
    downloadURL:
      selectedFile.previewUrl,

    contentType:
      file.type
  });

}


function setUploadStatus(message){

  /*
   * 只修改文字。
   * 不會摧毀 progressBar。
   */

  $("uploadText")
    .textContent =
    message;


  $("uploadStatus")
    .classList
    .remove("hide");

}


async function saveRecord(){

  if(
    activeHour === null ||
    !user ||
    !roomId
  ){

    toast(
      "目前無法儲存紀錄"
    );

    return;

  }


  const path =
    recordPath(
      currentDate,
      activeHour,
      user.uid
    );


  const old =
    room?.records?.[
      pad(activeHour)
    ]?.[user.uid] ||
    null;


  let media =
    old?.media ||
    null;


  let newStoragePath =
    null;


  try{

    $("saveRecord")
      .disabled =
      true;


    setUploadStatus(
      selectedFile
        ? "準備上傳媒體…"
        : "正在儲存紀錄…"
    );


    if(selectedFile){

      const file =
        selectedFile.file;


      newStoragePath =
        `
          room-media/
          ${roomId}/
          ${user.uid}/
          ${dateKey(currentDate)}_${pad(activeHour)}/
          ${crypto.randomUUID()}-
          ${safeFileName(file.name)}
        `.replace(
          /\s+/g,
          ""
        );


      const task =
        uploadBytesResumable(
          storageRef(
            storage,
            newStoragePath
          ),
          file,
          {
            contentType:
              file.type,

            customMetadata:{
              roomId,
              uid:user.uid
            }

          }
        );


      await new Promise(
        (resolve,reject) => {

          task.on(

            "state_changed",

            snapshot => {

              const percent =
                snapshot.totalBytes
                  ? Math.round(
                      snapshot.bytesTransferred /
                      snapshot.totalBytes *
                      100
                    )
                  : 0;


              setUploadStatus(
                `正在上傳媒體… ${percent}%`
              );


              $("progressBar")
                .style
                .width =
                `${percent}%`;

            },

            reject,

            async () => {

              try{

                media = {

                  storagePath:
                    newStoragePath,

                  downloadURL:
                    await getDownloadURL(
                      task.snapshot.ref
                    ),

                  contentType:
                    file.type,

                  name:
                    file.name,

                  size:
                    file.size

                };


                resolve();

              }catch(error){

                reject(error);

              }

            }

          );

        }
      );

    }


    const text =
      $("caption")
        .value
        .trim();


    const authorName =
      $("name")
        .value
        .trim() ||
      "我";


    const now =
      Date.now();


    await set(
      ref(
        db,
        path
      ),
      {

        date:
          dateKey(
            currentDate
          ),

        hour:
          activeHour,

        text,

        authorUid:
          user.uid,

        authorName,

        savedAt:
          old?.savedAt ||
          now,

        updatedAt:
          now,

        media

      }
    );


    if(
      old?.media?.storagePath &&
      newStoragePath &&
      old.media.storagePath !==
      newStoragePath
    ){

      deleteObject(
        storageRef(
          storage,
          old.media.storagePath
        )
      )
      .catch(
        console.warn
      );

    }


    closeRecord();


    toast(
      "已同步到雲端"
    );


  }catch(error){

    if(newStoragePath){

      try{

        await deleteObject(
          storageRef(
            storage,
            newStoragePath
          )
        );

      }catch{}

    }


    console.error(
      "saveRecord:",
      error
    );


    setUploadStatus(
      "儲存失敗："+friendlyError(error)
    );


    toast(
      "儲存失敗："+friendlyError(error)
    );


  }finally{

    $("saveRecord")
      .disabled =
      false;

  }

}

async function toggleNotification(){

  if(
    !roomId ||
    !user
  ){

    toast(
      "請先登入並加入房間"
    );

    return;

  }


  try{

    const enabled =
      room?.myNotification
        ?.enabled === true;


    if(enabled){

      await update(
        ref(
          db,
          `
            rooms/${roomId}/
            notificationSettings/${user.uid}
          `.replace(
            /\s+/g,
            ""
          )
        ),
        {
          enabled:false,
          updatedAt:Date.now()
        }
      );


      toast(
        "提醒已關閉"
      );


      return;

    }


    if(
      !("Notification" in window)
    ){

      toast(
        "這個瀏覽器不支援通知"
      );

      return;

    }


    let permission =
      Notification.permission;


    if(
      permission ===
      "default"
    ){

      permission =
        await Notification.requestPermission();

    }


    if(
      permission !==
      "granted"
    ){

      toast(
        "沒有允許通知"
      );

      return;

    }


    if(
      !(await isSupported())
    ){

      toast(
        "瀏覽器不支援 Firebase 推播"
      );

      return;

    }


    const registration =
      await navigator
        .serviceWorker
        .register(
          "./firebase-messaging-sw.js",
          {
            scope:"./"
          }
        );


    const token =
      await getToken(
        getMessaging(app),
        {
          vapidKey:
            VAPID_PUBLIC_KEY,

          serviceWorkerRegistration:
            registration
        }
      );


    if(!token){

      throw new Error(
        "無法取得推播 token"
      );

    }


    await set(
      ref(
        db,
        `
          fcmTokens/
          ${user.uid}/
          ${tokenKey(token)}
        `.replace(
          /\s+/g,
          ""
        )
      ),
      {
        token,
        createdAt:
          Date.now(),
        updatedAt:
          Date.now()
      }
    );


    await update(
      ref(
        db,
        `
          rooms/${roomId}/
          notificationSettings/${user.uid}
        `.replace(
          /\s+/g,
          ""
        )
      ),
      {
        enabled:true,
        minute:0,
        timezone:"Asia/Taipei",
        updatedAt:Date.now()
      }
    );


    toast(
      "提醒已開啟"
    );


  }catch(error){

    console.error(
      "toggleNotification:",
      error
    );


    toast(
      "通知設定失敗："+friendlyError(error)
    );

  }

}

/*
 * =====================================================
 * 離開房間
 * =====================================================
 */

async function leaveRoom(){

  if(
    !user ||
    !roomId
  ){

    toast(
      "目前沒有加入房間"
    );

    return;

  }


  if(
    !confirm(
      "確定要離開這個房間嗎？"
    )
  ){

    return;

  }


  const id =
    roomId;


  try{

    /*
     * 每次重新從 Firebase 讀取最新資料。
     */
    const [
      metaSnapshot,
      membersSnapshot
    ] =
      await Promise.all([

        get(
          ref(
            db,
            `rooms/${id}/meta`
          )
        ),

        get(
          ref(
            db,
            `rooms/${id}/members`
          )
        )

      ]);


    /*
     * 房間已經不存在。
     */

    if(
      !metaSnapshot.exists()
    ){

      leaveLocal();

      toast(
        "房間已不存在"
      );

      return;

    }


    const meta =
      metaSnapshot.val() ||
      {};

    const members =
      membersSnapshot.val() ||
      {};

    const memberIds =
      Object.keys(
        members
      );


    const amOwner =
      meta.ownerUid ===
      user.uid;


    /*
     * 自己已經不在 members。
     */

    if(
      !members[user.uid]
    ){

      leaveLocal();

      toast(
        "你已經不在這個房間"
      );

      return;

    }


    /*
     * =================================================
     * 情況 1：
     * 只有自己。
     * =================================================
     */

    if(
      memberIds.length === 1
    ){

      /*
       * 異常情況：
       * 最後一人不是房主。
       *
       * 不刪整個房間。
       */
      if(!amOwner){

        await remove(
          ref(
            db,
            `rooms/${id}/members/${user.uid}`
          )
        );


        await remove(
          ref(
            db,
            `rooms/${id}/notificationSettings/${user.uid}`
          )
        )
        .catch(
          () => {}
        );


        leaveLocal();


        toast(
          "已離開房間"
        );


        return;

      }


      /*
       * 最後一位就是房主：
       * 刪除整個房間。
       *
       * 一步一步做。
       */

      await remove(
        ref(
          db,
          `rooms/${id}/records`
        )
      );


      await remove(
        ref(
          db,
          `rooms/${id}/notificationSettings`
        )
      );


      await remove(
        ref(
          db,
          `rooms/${id}/members`
        )
      );


      await remove(
        ref(
          db,
          `rooms/${id}/meta`
        )
      );


      leaveLocal();


      toast(
        "你是最後一位成員，房間已刪除"
      );


      return;

    }


    /*
     * =================================================
     * 情況 2：
     * 房主離開，而且還有其他成員。
     * =================================================
     */

    if(amOwner){

      /*
       * 找下一個房主。
       */

      const newOwnerUid =
        memberIds.find(
          uid =>
            uid !==
            user.uid
        );


      if(
        !newOwnerUid
      ){

        throw new Error(
          "找不到可以接任的成員"
        );

      }


      const newOwnerName =
        members?.[
          newOwnerUid
        ]?.displayName ||
        "下一位成員";


      /*
       * 第一步：
       * 單獨轉移 ownerUid。
       *
       * 舊房主目前仍然是成員，
       * 因此這一步可以驗證新房主確實存在於 members。
       */

      await update(
        ref(
          db,
          `rooms/${id}/meta`
        ),
        {
          ownerUid:
            newOwnerUid,

          updatedAt:
            Date.now()
        }
      );


      /*
       * 第二步：
       * 刪除舊房主自己的 member。
       */

      await remove(
        ref(
          db,
          `rooms/${id}/members/${user.uid}`
        )
      );


      /*
       * 第三步：
       * 清除舊房主的通知設定。
       *
       * 即使這一步失敗，
       * 也不能把已完成的房主轉移判定為失敗。
       */

      await remove(
        ref(
          db,
          `rooms/${id}/notificationSettings/${user.uid}`
        )
      )
      .catch(
        error => {

          console.warn(
            "notification cleanup:",
            error
          );

        }
      );


      leaveLocal();


      toast(
        `已離開房間，${newOwnerName} 成為新房主`
      );


      return;

    }


    /*
     * =================================================
     * 情況 3：
     * 一般成員離開。
     * =================================================
     */

    await remove(
      ref(
        db,
        `rooms/${id}/members/${user.uid}`
      )
    );


    /*
     * 通知設定刪除不是離開的核心操作。
     */

    await remove(
      ref(
        db,
        `rooms/${id}/notificationSettings/${user.uid}`
      )
    )
    .catch(
      error => {

        console.warn(
          "notification cleanup:",
          error
        );

      }
    );


    leaveLocal();


    toast(
      "已離開房間"
    );


  }catch(error){

    console.error(
      "leaveRoom failed:",
      error
    );


    toast(
      "離開房間失敗："+friendlyError(error)
    );

  }

}

function changeDate(
  offset
){

  const next =
    addDays(
      currentDate,
      offset
    );


  if(
    dateKey(next) >
    dateKey(new Date())
  ){

    return;

  }


  currentDate =
    next;


  lastRenderedHour =
    null;


  loadRecordsListener();

  render();

}

        1;


      /*
       * 跨整點後重新 render。
       */

      if(
        lastRenderedHour !==
        maxHour
      ){

        lastRenderedHour =
          maxHour;


        render();

      }


      const next =
        new Date(now);


      next.setSeconds(
        0,
        0
      );


      next.setMinutes(
        0,
        0
      );


      next.setHours(
        next.getHours() +
        1
      );


      const np =
        taipeiParts(next);


      $("next")
        .textContent =
        `下一個紀錄點 ${np.hour}:00`;

    }

  },
  1000
);


onAuthStateChanged(
  auth,
  async currentUser => {

    user =
      currentUser;


    renderAccount();


    if(!currentUser){

      clearListeners();

      room =
        null;


      $("room")
        .classList
        .add("hide");


      $("setup")
        .classList
        .remove("hide");


      showSetupStatus(
        "請先登入 Google 帳號"
      );


      return;

    }


    showSetupStatus(
      "Google 登入成功"
    );


    await loadProfile();


    renderAccount();


    await initForegroundMessaging();


    const savedRoom =
      localStorage.getItem(
        "momentlog_room"
      );


    if(savedRoom){

      roomId =
        savedRoom;

      connectRoom();

    }

  }
);

</script>

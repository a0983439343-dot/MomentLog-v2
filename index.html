<!doctype html>
<html lang="zh-Hant" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7fb">
<meta name="description" content="MomentLog - 一起記錄每個時刻">
<meta name="google" content="notranslate">
<link rel="manifest" href="./manifest.webmanifest">
<title>MomentLog</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --bg:linear-gradient(135deg,#eef2ff,#f8fafc);
  --text:#172033;
  --muted:#718096;
  --border:#e6eaf0;
  --card:#fff;
  --primary:#4f46e5;
}

html,body{
  margin:0;
  min-height:100%;
  background:#f8fafc
}

body{
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color:var(--text);
  background:var(--bg);
  transition:.25s
}

body.dark{
  --text:#e5e7eb;
  --muted:#94a3b8;
  --border:#334155;
  --card:#172033;
  background:#0f172a
}

body.dark .btn,
body.dark .field input,
body.dark .field textarea,
body.dark .field select,
body.dark .slotBox,
body.dark .member,
body.dark .stat,
body.dark .modalCard,
body.dark .loginStatus,
body.dark .status{
  background:#172033;
  color:#e5e7eb;
  border-color:#334155
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.hide{display:none!important}

.app{
  width:min(1180px,100%);
  margin:auto;
  padding:16px 16px 90px
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:14px
}

.brand{
  display:flex;
  gap:10px;
  align-items:center
}

.icon{
  width:45px;
  height:45px;
  border-radius:14px;
  background:#111827;
  color:#fff;
  display:grid;
  place-items:center;
  font-size:22px;
  flex:none
}

.brand h1{
  margin:0;
  font-size:21px
}

.brand small,
.muted{
  color:var(--muted)
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:flex-end
}

.btn{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:12px;
  padding:10px 13px;
  min-height:40px
}

.btn.primary{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary)
}

.btn.danger{
  background:#fee2e2;
  color:#dc2626;
  border-color:#fecaca
}

.btn.active{
  background:#dcfce7;
  color:#166534;
  border-color:#86efac
}

.btn.small{
  padding:7px 9px;
  min-height:34px;
  font-size:12px
}

.card{
  background:rgba(255,255,255,.96);
  border-radius:20px;
  box-shadow:0 14px 38px rgba(15,23,42,.08)
}

.setup{
  max-width:560px;
  margin:6vh auto;
  padding:28px
}

.setup h2{
  margin:0 0 8px
}

.setup p{
  line-height:1.7;
  color:var(--muted)
}

.field{
  margin:12px 0
}

.field label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:6px
}

.field input,
.field textarea,
.field select{
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--card);
  color:var(--text);
  outline:none
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:#818cf8;
  box-shadow:0 0 0 3px rgba(99,102,241,.1)
}

.setupActions{
  display:grid;
  gap:8px;
  margin-top:14px
}

.loginStatus,
.status{
  margin-top:10px;
  padding:10px;
  border-radius:12px;
  background:#f8fafc;
  border:1px solid var(--border);
  font-size:13px
}

.privacy{
  margin-top:10px;
  color:var(--muted);
  font-size:12px;
  line-height:1.6
}

.account{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border:1px solid var(--border);
  border-radius:13px;
  background:#f8fafc;
  margin-top:12px
}

.accountAvatar{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
  background:#e0e7ff;
  display:grid;
  place-items:center;
  flex:none
}

.accountInfo{
  min-width:0;
  flex:1
}

.accountName{
  font-weight:800;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.accountEmail{
  font-size:12px;
  color:var(--muted);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.hero{
  padding:18px;
  margin-bottom:14px
}

.heroRow{
  display:flex;
  justify-content:space-between;
  gap:10px
}

.hero h2{
  margin:0;
  font-size:24px
}

.clock{
  font-size:25px;
  font-weight:800;
  text-align:right
}

.next{
  font-size:12px;
  color:var(--muted);
  text-align:right;
  margin-top:2px
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:14px
}

.stat{
  padding:12px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--card)
}

.statTitle{
  font-size:12px;
  color:var(--muted)
}

.statValue{
  font-size:18px;
  font-weight:800;
  margin-top:4px;
  word-break:break-word
}

.grid{
  display:grid;
  grid-template-columns:290px 1fr;
  gap:14px
}

.side{
  padding:15px;
  position:sticky;
  top:12px;
  align-self:start
}

.sideTitle{
  font-weight:800;
  margin-bottom:10px
}

.members{
  display:grid;
  gap:8px
}

.member{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center;
  border:1px solid var(--border);
  border-radius:12px;
  padding:9px;
  background:var(--card)
}

.memberName{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.memberRight{
  display:flex;
  gap:5px;
  align-items:center;
  flex:none
}

.badge{
  padding:5px 8px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap
}

.badge.done{
  background:#dcfce7;
  color:#166534
}

.badge.wait{
  background:#fef3c7;
  color:#92400e
}

.badge.owner{
  background:#e0e7ff;
  color:#3730a3
}

.sideButtons{
  display:grid;
  gap:8px;
  margin-top:14px
}

.timeline{
  padding:16px;
  min-width:0
}

.timelineHead{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start;
  margin-bottom:12px
}

.timelineHead h3{
  margin:0
}

.dateTools{
  display:flex;
  gap:6px
}

.dateBtn{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:10px;
  padding:8px 10px
}

.slots{
  display:grid;
  gap:10px
}

.emptyTimeline{
  padding:28px 15px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--border);
  border-radius:14px;
  background:#f8fafc
}

.slot{
  display:grid;
  grid-template-columns:60px 1fr;
  gap:8px
}

.time{
  font-size:12px;
  font-weight:800;
  color:var(--muted);
  text-align:right;
  padding-top:11px
}

.slotBox{
  border:1px solid var(--border);
  border-radius:14px;
  padding:11px;
  background:var(--card)
}

.slotTitle{
  display:flex;
  justify-content:space-between;
  gap:8px
}

.pill{
  display:inline-flex;
  margin-top:8px;
  padding:6px 9px;
  border-radius:9px;
  font-size:12px;
  font-weight:800
}

.pill.now{
  background:#e0e7ff;
  color:#3730a3
}

.pill.done{
  background:#dcfce7;
  color:#166534
}

.caption{
  margin-top:8px;
  line-height:1.65;
  white-space:pre-wrap;
  word-break:break-word
}

.media{
  margin-top:9px;
  border-radius:11px;
  overflow:hidden;
  background:#111827
}

.media img,
.media video{
  display:block;
  width:100%;
  max-height:500px;
  object-fit:contain
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.56);
  display:none;
  align-items:center;
  justify-content:center;
  padding:12px;
  z-index:1000
}

.modal.show{
  display:flex
}

.modalCard{
  width:min(620px,100%);
  background:var(--card);
  color:var(--text);
  border-radius:20px;
  padding:17px;
  max-height:90vh;
  overflow:auto
}

.modalHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px
}

.close{
  width:38px;
  height:38px;
  border:1px solid var(--border);
  border-radius:50%;
  background:var(--card);
  color:var(--text)
}

.mediaBtns{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px
}

.hidden{
  display:none
}

.modalActions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:14px
}

.themeGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px
}

.themeOpt{
  border:2px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:12px;
  padding:8px;
  text-align:left
}

.themeOpt.selected{
  border-color:var(--primary)
}

.swatch{
  height:48px;
  border-radius:9px;
  margin-bottom:6px
}

.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  z-index:3000;
  display:none;
  background:#111827;
  color:#fff;
  padding:10px 14px;
  border-radius:999px;
  font-size:13px;
  max-width:calc(100vw - 30px);
  text-align:center
}

.progress{
  height:8px;
  background:#e5e7eb;
  border-radius:999px;
  overflow:hidden;
  margin-top:8px
}

.progressBar{
  height:100%;
  width:0;
  background:#4f46e5;
  transition:.2s
}

@media(max-width:940px){
  .grid{
    grid-template-columns:1fr
  }

  .side{
    position:static
  }

  .stats{
    grid-template-columns:1fr 1fr 1fr
  }
}

@media(max-width:720px){
  .top{
    align-items:flex-start
  }

  .actions{
    display:grid;
    grid-template-columns:1fr 1fr
  }

  .heroRow{
    flex-direction:column
  }

  .clock,
  .next{
    text-align:left
  }
}

@media(max-width:580px){
  .stats{
    grid-template-columns:1fr 1fr
  }

  .mediaBtns{
    grid-template-columns:1fr 1fr
  }

  .themeGrid{
    grid-template-columns:1fr
  }

  .slot{
    grid-template-columns:52px 1fr
  }

  .modalActions{
    display:grid;
    grid-template-columns:1fr 1fr
  }
}
</style>
</head>

<body>

<div class="app">

<section id="setup" class="setup card">

  <div class="icon">⏱️</div>

  <h2>MomentLog</h2>

  <p>
    登入 Google 帳號後建立房間，
    與朋友一起即時記錄每個時刻。
  </p>

  <div id="loginArea">

    <button id="googleLogin" class="btn primary">
      🔐 使用 Google 帳號登入
    </button>

    <div class="privacy">
      Google 帳號只用來驗證你的身份。
      房間內顯示的是你設定的 MomentLog 暱稱。
    </div>

  </div>

  <div id="profileArea" class="hide">

    <div class="account">

      <img
        id="accountAvatar"
        class="accountAvatar"
        alt=""
      >

      <div class="accountInfo">

        <div
          id="accountName"
          class="accountName"
        ></div>

        <div
          id="accountEmail"
          class="accountEmail"
        ></div>

      </div>

      <button id="logout" class="btn">
        登出
      </button>

    </div>

    <div class="field">

      <label for="name">
        你的暱稱
      </label>

      <input
        id="name"
        maxlength="30"
        placeholder="例如：小明"
        autocomplete="nickname"
        translate="no"
      >

    </div>

    <div class="field">

      <label for="log">
        Log 名稱
      </label>

      <input
        id="log"
        maxlength="60"
        placeholder="例如：我們的暑假"
        autocomplete="off"
        translate="no"
      >

    </div>

    <div class="setupActions">

      <button
        id="saveProfile"
        class="btn"
      >
        保存個人資料
      </button>

      <button
        id="create"
        class="btn primary"
      >
        建立新房間
      </button>

    </div>

    <hr
      style="border:0;border-top:1px solid #e6eaf0;margin:18px 0"
    >

    <div class="field">

      <label for="joinCode">
        加入房間碼
      </label>

      <input
        id="joinCode"
        maxlength="12"
        placeholder="例如 ABCD1234"
        autocomplete="off"
        translate="no"
      >

    </div>

    <div class="setupActions">

      <button
        id="join"
        class="btn"
      >
        加入房間
      </button>

    </div>

  </div>

  <div
    id="setupStatus"
    class="muted"
    style="font-size:13px;margin-top:10px"
  >
    正在連線…
  </div>

</section>


<section id="room" class="hide">

<header class="top">

  <div class="brand">

    <div class="icon">
      ⏱️
    </div>

    <div>

      <h1>MomentLog</h1>

      <small>
        一起記錄每個時刻
      </small>

    </div>

  </div>

  <div class="actions">

    <button
      id="notify"
      class="btn"
    >
      🔕 通知：關閉
    </button>

    <button
      id="theme"
      class="btn"
    >
      🎨 主題
    </button>

    <button
      id="invite"
      class="btn"
    >
      邀請
    </button>

    <button
      id="leave"
      class="btn danger"
    >
      離開房間
    </button>

  </div>

</header>


<section class="hero card">

  <div class="heroRow">

    <div>

      <h2 id="title">
        MomentLog
      </h2>

      <div
        id="sub"
        class="muted"
      ></div>

    </div>

    <div>

      <div
        id="clock"
        class="clock"
      >
        00:00:00
      </div>

      <div
        id="next"
        class="next"
      ></div>

    </div>

  </div>

  <div class="stats">

    <div class="stat">

      <div class="statTitle">
        已到時段
      </div>

      <div
        id="available"
        class="statValue"
      >
        0
      </div>

    </div>

    <div class="stat">

      <div class="statTitle">
        今日已完成
      </div>

      <div
        id="doneCount"
        class="statValue"
      >
        0
      </div>

    </div>

    <div class="stat">

      <div class="statTitle">
        房間碼
      </div>

      <div
        id="roomCode"
        class="statValue"
      ></div>

    </div>

  </div>

</section>


<main class="grid">

<aside class="side card">

  <div class="sideTitle">
    房間成員
  </div>

  <div
    id="members"
    class="members"
  ></div>

  <div class="sideButtons">

    <button
      id="now"
      class="btn primary"
    >
      📍 記錄現在
    </button>

    <button
      id="yesterday"
      class="btn"
    >
      查看昨天
    </button>

    <button
      id="today"
      class="btn hide"
    >
      ↩ 返回今天
    </button>

  </div>

</aside>


<section class="timeline card">

  <div class="timelineHead">

    <div>

      <h3>
        時間軸
      </h3>

      <div
        id="dateLabel"
        class="muted"
        style="font-size:13px;margin-top:4px"
      ></div>

    </div>

    <div class="dateTools">

      <button
        id="prevDate"
        class="dateBtn"
      >
        ‹
      </button>

      <button
        id="nextDate"
        class="dateBtn"
      >
        ›
      </button>

    </div>

  </div>

  <div
    id="slots"
    class="slots"
  ></div>

</section>

</main>

</section>

</div>


<div
  id="recordModal"
  class="modal"
>

<div class="modalCard">

  <div class="modalHead">

    <div>

      <h3>
        記錄這個時刻
      </h3>

      <div
        id="recordWhen"
        class="muted"
      ></div>

    </div>

    <button
      id="recordClose"
      class="close"
    >
      ×
    </button>

  </div>

  <div class="field">

    <label for="caption">
      內容
    </label>

    <textarea
      id="caption"
      maxlength="3000"
      rows="6"
      placeholder="寫下這一刻發生了什麼…"
      translate="no"
    ></textarea>

  </div>

  <div class="mediaBtns">

    <button
      id="photo"
      class="btn"
    >
      📷 拍照
    </button>

    <button
      id="video"
      class="btn"
    >
      🎥 錄影
    </button>

    <button
      id="album"
      class="btn"
    >
      🖼️ 相簿
    </button>

    <button
      id="remove"
      class="btn danger"
    >
      🗑️ 移除媒體
    </button>

  </div>

  <input
    id="photoInput"
    class="hidden"
    type="file"
    accept="image/*"
    capture="environment"
  >

  <input
    id="videoInput"
    class="hidden"
    type="file"
    accept="video/*"
    capture="environment"
  >

  <input
    id="albumInput"
    class="hidden"
    type="file"
    accept="image/*,video/*"
  >

  <div id="preview"></div>

  <div
    id="uploadStatus"
    class="status hide"
  >

    <div id="uploadText">
      準備中…
    </div>

    <div class="progress">
      <div
        id="progressBar"
        class="progressBar"
      ></div>
    </div>

  </div>

  <div class="modalActions">

    <button
      id="cancelRecord"
      class="btn"
    >
      取消
    </button>

    <button
      id="saveRecord"
      class="btn primary"
    >
      儲存
    </button>

  </div>

</div>

</div>


<div
  id="themeModal"
  class="modal"
>

<div class="modalCard">

  <div class="modalHead">

    <h3>
      🎨 背景主題
    </h3>

    <button
      id="themeClose"
      class="close"
    >
      ×
    </button>

  </div>

  <div class="themeGrid">

    <button
      class="themeOpt"
      data-theme="default"
    >
      <div
        class="swatch"
        style="background:linear-gradient(135deg,#eef2ff,#f8fafc)"
      ></div>
      🌤️ 預設
    </button>

    <button
      class="themeOpt"
      data-theme="blue"
    >
      <div
        class="swatch"
        style="background:linear-gradient(135deg,#dbeafe,#eff6ff)"
      ></div>
      🌊 藍色
    </button>

    <button
      class="themeOpt"
      data-theme="green"
    >
      <div
        class="swatch"
        style="background:linear-gradient(135deg,#dcfce7,#f0fdf4)"
      ></div>
      🌿 綠色
    </button>

    <button
      class="themeOpt"
      data-theme="pink"
    >
      <div
        class="swatch"
        style="background:linear-gradient(135deg,#fce7f3,#fff1f2)"
      ></div>
      🌸 粉色
    </button>

    <button
      class="themeOpt"
      data-theme="purple"
    >
      <div
        class="swatch"
        style="background:linear-gradient(135deg,#ede9fe,#f5f3ff)"
      ></div>
      💜 紫色
    </button>

    <button
      class="themeOpt"
      data-theme="sunset"
    >
      <div
        class="swatch"
        style="background:linear-gradient(135deg,#ffedd5,#fef3c7)"
      ></div>
      🌅 日落
    </button>

    <button
      class="themeOpt"
      data-theme="dark"
    >
      <div
        class="swatch"
        style="background:linear-gradient(135deg,#1e293b,#0f172a)"
      ></div>
      🌌 黑暗
    </button>

  </div>

</div>

</div>


<div
  id="toast"
  class="toast"
></div>

const pad=

const taipeiParts=
  date=>
    new Intl.DateTimeFormat(
      "zh-TW",
      {
        timeZone:"Asia/Taipei",
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit",

      }
    )
    .formatToParts(date)

const hourKey=
  h=>pad(h);

      /[&<>"']/g,

        ">":"&gt;",

const tokenKey=
  token=>{

    const bytes=
      new TextEncoder()
      .encode(token);

    let s="";

    bytes.forEach(
      b=>{
        s+=String.fromCharCode(b);
      }
    );

    return btoa(s)
      .replace(/\+/g,"-")
      .replace(/\//g,"_")
      .replace(/=+$/,"");

  };

function friendlyError(error){

  const code=
    error?.code||"";

  if(
    code.includes(
      "permission-denied"
    )||
    code.includes(
      "PERMISSION_DENIED"
    )
  ){

    return(
      "Firebase 權限被拒絕，請檢查 Realtime Database Rules"
    );

  }

  if(
    code.includes(
      "storage/unauthorized"
    )
  ){

    return(
      "Storage 權限被拒絕，請檢查 Storage Rules"
    );

  }

  if(
    code.includes(
      "storage/bucket-not-found"
    )
  ){

    return(
      "Storage 尚未建立"
    );

  }

  if(
    code.includes(
      "auth/unauthorized-domain"
    )
  ){

    return(
      "目前網站網域尚未加入 Firebase 授權網域"
    );

  }

  if(
    code.includes(
      "auth/operation-not-allowed"
    )
  ){

    return(
      "Firebase 尚未啟用 Google 登入"
    );

  }

  if(
    code.includes(
      "auth/popup-blocked"
    )
  ){

    return(
      "瀏覽器阻擋 Google 登入視窗"
    );

  }

  if(
    code.includes(
      "auth/popup-closed-by-user"
    )
  ){

    return(
      "你關閉了 Google 登入視窗"
    );

  }

  return(
    error?.message||
    "未知錯誤"
  );

}

  const name=
    validateName();

    return false;

  }

  try{

    const now=
      Date.now();


    await set(
      ref(
        db,
        `users/${user.uid}`
      ),
      {
        displayName:name,
        updatedAt:now,
        createdAt:
          room?.profile?.createdAt||
          now
      }
    );


    localStorage.setItem(
      "momentlog_name",
      name
    );


    room=room||{};

    room.profile={
      ...(room.profile||{}),
      displayName:name,
      updatedAt:now

    toast(
      "個人資料已保存"

      "saveProfile:",

async function createRoom(){

  if(!user){

    toast(
      "請先登入 Google 帳號"
    );

    return;

  }


  const name=
    validateName();

  if(!name)return;


  const log=
    validateLog();

  if(!log)return;


  const profileSaved=
    await saveProfile();

  if(!profileSaved){

    return;

  }


  try{

    let id="";


    for(
      let i=0;
      i<8&&!id;
      i++
    ){

      const candidate=
        crypto.randomUUID()
          .replace(/-/g,"")
          .slice(
            0,
            8
          )
          .toUpperCase();


      const tx=
        await runTransaction(
          ref(
            db,
            `rooms/${candidate}/meta`
          ),
          current=>{

            if(
              current!==null
            ){

              return;

            }


            return{
              roomId:candidate,
              name:log,
              ownerUid:user.uid,
              createdAt:Date.now(),
              updatedAt:Date.now()
            };

          }
        );


      if(tx.committed){

        id=
          candidate;

      }

    }


    if(!id){

      throw new Error(
        "房間碼建立失敗"
      );

    }


    await set(
      ref(
        db,
        memberPath(
          user.uid,
          id
        )
      ),
      {
        displayName:name,
        joinedAt:Date.now(),
        updatedAt:Date.now()
      }
    );


    localStorage.setItem(
      "momentlog_room",
      id
    );


    localStorage.setItem(
      "momentlog_name",
      name
    );


    roomId=
      id;

    currentDate=
      new Date();


    connectRoom();


    toast(
      "房間建立成功"
    );

  }catch(error){

    console.error(
      "createRoom:",
      error
    );

    toast(
      "建立房間失敗："+friendlyError(error)
    );

  }

}


async function joinRoom(){

  if(!user){

    toast(
      "請先登入 Google 帳號"
    );

    return;

  }


  const name=
    validateName();

  if(!name)return;


  const id=
    $("joinCode")
      .value
      .trim()
      .toUpperCase();


  if(
    !/^[A-Z0-9]{8,12}$/.test(id)
  ){

    toast(
      "房間碼格式不正確"
    );

    return;

  }


  try{

    const metaSnapshot=
      await get(
        ref(
          db,
          `rooms/${id}/meta`
        )
      );


    if(
      !metaSnapshot.exists()
    ){

      toast(
        "找不到這個房間"
      );

      return;

    }


    const now=
      Date.now();


    /*
     * 先建立 member。
     *
     * 注意：
     * 不在這裡先讀 records。
     * connectRoom 會處理後續 listener。
     */

    await set(
      ref(
        db,
        memberPath(
          user.uid,
          id
        )
      ),
      {
        displayName:name,
        joinedAt:now,
        updatedAt:now
      }
    );


    /*
     * 個人資料保存失敗不應該讓已加入的房間
     * 被誤判成「加入失敗」。
     */

    try{

      await set(
        ref(
          db,
          `users/${user.uid}`
        ),
        {
          displayName:name,
          updatedAt:now
        }
      );

    }catch(profileError){

      console.warn(
        "users profile save:",
        profileError
      );

    }


    localStorage.setItem(
      "momentlog_room",
      id
    );


    localStorage.setItem(
      "momentlog_name",
      name
    );


    roomId=
      id;

    currentDate=
      new Date();


    connectRoom();


    toast(
      "已加入房間"
    );


  }catch(error){

    console.error(
      "joinRoom:",
      error
    );

    toast(
      "加入房間失敗："+friendlyError(error)
    );

  }

}


function connectRoom(){

  clearListeners();


  if(
    !roomId||
    !user
  ){

    return;

  }


  room=
    room||{};


  /*
   * meta listener
   */

  unsubMeta=
    onValue(
      ref(
        db,
        `rooms/${roomId}/meta`
      ),
      snapshot=>{

        if(
          !snapshot.exists()
        ){

          toast(
            "房間不存在或已被刪除"
          );

          leaveLocal();

          return;

        }


        room=
          room||{};


        room.meta=
          snapshot.val()||{};


        render();

      },
      error=>{

        console.error(
          "META LISTENER:",
          error
        );

        toast(
          "房間資料讀取失敗："+friendlyError(error)
        );

      }
    );


  /*
   * Members listener
   */

  unsubMembers=
    onValue(
      ref(
        db,
        `rooms/${roomId}/members`
      ),
      snapshot=>{

        room=
          room||{};


        room.members=
          snapshot.val()||{};


        /*
         * 到這裡之後才啟動 records。
         *
         * 同一使用者加入後，
         * members 成功同步時才開始讀 records。
         */

        if(
          room.members[user.uid]
        ){

          loadRecordsListener();

        }else{

          /*
           * 如果房主剛把自己移除，
           * 不要把剩餘 listener 留著。
           */

          if(
            room?.meta?.ownerUid!==user.uid
          ){

            clearListeners();

            leaveLocal();

            toast(
              "你已離開這個房間"
            );

            return;

          }

        }


        render();

      },
      error=>{

        console.error(
          "MEMBERS LISTENER:",
          error
        );

        toast(
          "成員資料讀取失敗："+friendlyError(error)
        );

      }
    );


  /*
   * Notification listener
   */

  unsubSettings=
    onValue(
      ref(
        db,
        `rooms/${roomId}/notificationSettings/${user.uid}`
      ),
      snapshot=>{

        room=
          room||{};

        room.myNotification=
          snapshot.val()||{};

        renderNotify();

      },
      error=>{

        console.warn(
          "NOTIFICATION LISTENER:",
          error
        );

      }
    );

}


function loadRecordsListener(){

  if(
    unsubRecords
  ){

    try{
      unsubRecords();
    }catch{}

    unsubRecords=
      null;

  }


  if(
    !roomId||
    !user||
    !room?.members?.[user.uid]
  ){

    return;

  }


  const targetDate=
    dateKey(
      currentDate
    );


  unsubRecords=
    onValue(
      ref(
        db,
        `rooms/${roomId}/records/${targetDate}`
      ),
      snapshot=>{

        room=
          room||{};

        room.records=
          snapshot.val()||{};


        render();

      },
      error=>{

        console.error(
          "RECORDS LISTENER:",
          error,
          `rooms/${roomId}/records/${targetDate}`
        );

        toast(
          "紀錄讀取失敗："+friendlyError(error)
        );

      }
    );

}


function render(){

  if(
    !room?.meta||
    !user
  ){

    return;

  }


  $("setup")
    .classList
    .add("hide");


  $("room")
    .classList
    .remove("hide");


  $("title").textContent=
    room.meta.name||
    "MomentLog";


  $("roomCode").textContent=
    roomId;


  $("sub").textContent=
    `${dateKey(currentDate)} · 房間碼 ${roomId}`;


  const now=
    new Date();


  const p=
    taipeiParts(now);


  $("clock").textContent=
    `${p.hour}:${p.minute}:${p.second}`;


  const all=
    room.records||{};


  const entries=[];


  let maxHour;


  if(
    isToday(
      currentDate
    )
  ){

    /*
     * 今天：
     * 不顯示目前小時。
     *
     * 21:xx -> 最後 20:00
     */

    maxHour=
      Number(p.hour)-1;

  }else{

    /*
     * 歷史日期：
     * 顯示完整 00~23
     */

    maxHour=
      23;

  }


  for(
    let h=0;
    h<=maxHour;
    h++
  ){

    entries.push(
      [
        h,
        all[hourKey(h)]||{}
      ]
    );

  }


  $("available").textContent=
    String(
      entries.length
    );


  $("doneCount").textContent=
    String(
      entries.reduce(
        (count,[,slot])=>
          count+
          (slot?.[user.uid]?1:0),
        0
      )
    );


  $("dateLabel").textContent=
    isToday(
      currentDate
    )
      ?"今天"
      :`歷史日期：${dateKey(currentDate)}`;


  $("yesterday")
    .classList
    .toggle(
      "hide",
      !isToday(currentDate)
    );


  $("today")
    .classList
    .toggle(
      "hide",
      isToday(currentDate)
    );


  renderMembers();

  renderTimeline(
    entries
  );

  renderNotify();

  applyTheme();

}


function renderMembers(){

  const members=
    room.members||{};

  const records=
    room.records||{};

  const ownerUid=
    room.meta?.ownerUid;


  const html=
    Object.entries(
      members
    )
    .map(
      ([uid,m])=>{

        const done=
          Object.values(
            records
          )
          .some(
            slot=>
              !!slot?.[uid]
          );


        const owner=
          uid===ownerUid;


        return`
          <div class="member">

            <span class="memberName">
              👤
              ${escapeHtml(
                m?.displayName||
                "未命名"
              )}
            </span>

            <span class="memberRight">

              ${
                owner
                  ?'<span class="badge owner">房主</span>'
                  :""
              }

              <span class="badge ${
                done
                  ?"done"
                  :"wait"
              }">
                ${
                  done
                    ?"已完成"
                    :"等待中"
                }
              </span>

            </span>

          </div>
        `;

      }
    )
    .join("");


  $("members").innerHTML=
    html||
    "<div class='muted'>沒有成員</div>";

}


function renderTimeline(entries){

  if(!entries.length){

    $("slots").innerHTML=
      `
      <div class="emptyTimeline">
        目前還沒有已到達的紀錄點。
        <br>
        按「📍 記錄現在」可以記錄目前時刻。
      </div>
      `;

    return;

  }


  const p=
    taipeiParts(
      new Date()
    );


  $("slots").innerHTML=
    entries
      .map(
        ([h,users])=>{

          const mine=
            users?.[user.uid]||
            null;


          const isCurrent=
            isToday(currentDate) &&
            h===Number(p.hour);


          let media="";


          if(
            mine?.media?.downloadURL
          ){

            const type=
              mine.media.contentType||
              "";


            if(
              type.startsWith(
                "image/"
              )
            ){

              media=
                `
                <div class="media">

                  <img
                    src="${escapeHtml(
                      mine.media.downloadURL
                    )}"
                    alt="圖片"
                    loading="lazy"
                  >

                </div>
                `;

            }else if(
              type.startsWith(
                "video/"
              )
            ){

              media=
                `
                <div class="media">

                  <video
                    src="${escapeHtml(
                      mine.media.downloadURL
                    )}"
                    controls
                    playsinline
                    preload="metadata"
                  ></video>

                </div>
                `;

            }

          }


          return`
            <div class="slot">

              <div class="time">
                ${pad(h)}:00
              </div>

              <div class="slotBox">

                <div class="slotTitle">

                  <b>
                    ${
                      mine
                        ?"📌 已記錄"
                        :isCurrent
                          ?"⏰ 現在"
                          :"尚未紀錄"
                    }
                  </b>

                </div>

                ${
                  mine
                    ?'<div class="pill done">✅ 你已完成</div>'
                    :""
                }

                ${
                  isCurrent
                    ?'<div class="pill now">🔔 現在要記錄</div>'
                    :""
                }

                ${
                  mine?.text
                    ?`
                      <div class="caption">
                        ${escapeHtml(
                          mine.text
                        )}
                      </div>
                    `
                    :""
                }

                ${media}

                <div style="margin-top:9px">

                  <button
                    class="btn ${
                      mine
                        ?"primary"
                        :""
                    }"
                    data-hour="${h}"
                  >
                    ${
                      mine
                        ?"編輯紀錄"
                        :"立即紀錄"
                    }
                  </button>

                </div>

              </div>

            </div>
          `;

        }
      )
      .join("");


  document
    .querySelectorAll(
      "[data-hour]"
    )
    .forEach(
      button=>{

        button.onclick=()=>{
          openRecord(
            Number(
              button.dataset.hour
            )
          );
        };

      }
    );

}


function openRecord(hour){

  if(
    !user||
    !roomId
  ){

    toast(
      "請先加入房間"
    );

    return;

  }


  activeHour=
    hour;


  selectedFile=
    null;


  const mine=
    room?.records?.[
      hourKey(hour)
    ]?.[user.uid]||
    null;


  $("recordWhen").textContent=
    `${dateKey(currentDate)} · ${pad(hour)}:00`;


  $("caption").value=
    mine?.text||
    "";


  $("uploadStatus")
    .classList
    .add("hide");


  $("progressBar").style.width=
    "0%";


  renderPreview(
    mine?.media?.downloadURL,
    mine?.media?.contentType
  );


  $("recordModal")
    .classList
    .add("show");

}


function closeRecord(){

  if(
    selectedFile?.previewUrl
  ){

    URL.revokeObjectURL(
      selectedFile.previewUrl
    );

  }


  $("recordModal")
    .classList
    .remove("show");


  selectedFile=
    null;


  activeHour=
    null;


  $("preview").innerHTML=
    "";


  $("uploadStatus")
    .classList
    .add("hide");


  $("progressBar").style.width=
    "0%";

}


function renderPreview(
  url,
  type,
  fileUrl=""
){

  const src=
    fileUrl||
    url;


  if(!src){

    $("preview").innerHTML=
      "";

    return;

  }


  if(
    (type||"")
      .startsWith(
        "image/"
      )
  ){

    $("preview").innerHTML=
      `
      <div class="media">

        <img
          src="${escapeHtml(src)}"
          alt="預覽"
        >

      </div>
      `;

  }else{

    $("preview").innerHTML=
      `
      <div class="media">

        <video
          src="${escapeHtml(src)}"
          controls
          playsinline
        ></video>

      </div>
      `;

  }

}


function chooseFile(file){

  if(!file)return;


  if(
    !/^(image|video)\//
      .test(
        file.type
      )
  ){

    toast(
      "只支援圖片或影片"
    );

    return;

  }


  if(
    file.size>
    250*1024*1024
  ){

    toast(
      "單檔不能超過 250MB"
    );

    return;

  }


  if(
    selectedFile?.previewUrl
  ){

    URL.revokeObjectURL(
      selectedFile.previewUrl
    );

  }


  selectedFile={
    file,
    previewUrl:
      URL.createObjectURL(
        file
      )
  };


  renderPreview(
    "",
    file.type,
    selectedFile.previewUrl
  );

}


function setUploadStatus(text){

  $("uploadStatus")
    .textContent=
    text;

  $("uploadStatus")

    .remove("hide");

}


async function saveRecord(){

  if(
    activeHour===null||
    !user||
    !roomId
  ){

    return;

  }


  const path=
    recordPath(
      currentDate,
      activeHour,
      user.uid
    );


  const old=
    room?.records?.[
      hourKey(activeHour)
    ]?.[user.uid]||
    null;


  let media=
    old?.media||
    null;


  let newStoragePath=
    null;


  try{

    $("saveRecord")
      .disabled=true;


    setUploadStatus(
      selectedFile
        ?"正在上傳媒體…"
        :"正在儲存紀錄…"
    );


    if(selectedFile){

      const file=
        selectedFile.file;


      if(
        file.size>
        250*1024*1024
      ){

        throw new Error(
          "單檔不能超過 250MB"
        );

      }


      newStoragePath=
        `room-media/${roomId}/${user.uid}/${dateKey(currentDate)}_${pad(activeHour)}/${crypto.randomUUID()}-${safeFileName(file.name)}`;


      const uploadTask=
        uploadBytesResumable(
          storageRef(
            storage,
            newStoragePath
          ),
          file,
          {
            contentType:file.type,
            customMetadata:{
              roomId,
              uid:user.uid
            }
          }
        );


      await new Promise(
        (resolve,reject)=>{

          uploadTask.on(
            "state_changed",

            snapshot=>{

              const percent=
                snapshot.totalBytes
                  ?Math.round(
                    snapshot.bytesTransferred/
                    snapshot.totalBytes*
                    100
                  )
                  :0;


              $("uploadStatus")
                .classList
                .remove("hide");


              $("uploadText")
                .textContent=
                `正在上傳媒體… ${percent}%`;


              $("progressBar")
                .style
                .width=
                `${percent}%`;

            },

            error=>{
              reject(error);
            },

            async()=>{

              try{

                const url=
                  await getDownloadURL(
                    uploadTask.snapshot.ref
                  );


                media={
                  storagePath:
                    newStoragePath,

                  downloadURL:url,

                  contentType:
                    file.type,

                  name:
                    file.name,

                  size:
                    file.size
                };


                resolve();

              }catch(error){

                reject(error);

              }

            }
          );

        }
      );

    }


    const text=
      $("caption")
        .value
        .trim();


    const now=
      Date.now();


    const authorName=
      localStorage.getItem(
        "momentlog_name"
      )||
      $("name")
        .value
        .trim()||
      "我";


    await set(
      ref(db,path),
      {
        date:
          dateKey(currentDate),

        hour:
          activeHour,

        text,

        authorUid:
          user.uid,

        authorName,

        savedAt:
          old?.savedAt||
          now,

        updatedAt:
          now,

        media
      }
    );


    if(
      old?.media?.storagePath&&
      newStoragePath&&
      old.media.storagePath!==newStoragePath
    ){

      deleteObject(
        storageRef(
          storage,
          old.media.storagePath
        )
      )
      .catch(
        console.warn
      );

    }


    closeRecord();

    toast(
      "已同步到雲端"
    );


  }catch(error){

    if(newStoragePath){

      try{

        await deleteObject(
          storageRef(
            storage,
            newStoragePath
          )
        );

      }catch{}

    }


    console.error(
      "saveRecord:",
      error
    );


    setUploadStatus(
      "儲存失敗："+friendlyError(error)
    );


    toast(
      "儲存失敗："+friendlyError(error)
    );

  }finally{

    $("saveRecord")
      .disabled=false;

  }

}

async function toggleNotification(){

  if(
    !user||
    !roomId
  ){

    toast(
      "請先登入並加入房間"
    );

    return;

  }


  try{

    const current=
      room?.myNotification?.enabled===true;


    if(current){

      await update(
        ref(
          db,
          `rooms/${roomId}/notificationSettings/${user.uid}`
        ),
        {
          enabled:false,
          updatedAt:Date.now()
        }
      );


      toast(
        "提醒已關閉"
      );


      return;

    }


    if(
      !("Notification" in window)
    ){

      toast(
        "這個瀏覽器不支援通知"
      );

      return;

    }


    if(
      Notification.permission===
      "denied"
    ){

      toast(
        "請到瀏覽器網站設定允許通知"
      );

      return;

    }


    if(
      Notification.permission===
      "default"
    ){

      const permission=
        await Notification.requestPermission();


      if(
        permission!=="granted"
      ){

        toast(
          "沒有允許通知"
        );

        return;

      }

    }


    if(
      !(await isSupported())
    ){

      toast(
        "這個瀏覽器不支援 Firebase 推播"
      );

      return;

    }


    const registration=
      await navigator
        .serviceWorker
        .register(
          "./firebase-messaging-sw.js",
          {
            scope:"./"
          }
        );


    const messaging=
      getMessaging(app);


    const token=
      await getToken(
        messaging,
        {
          vapidKey:
            VAPID_PUBLIC_KEY,

          serviceWorkerRegistration:
            registration
        }
      );


    if(!token){

      throw new Error(
        "無法取得推播 token"
      );

    }


    await set(
      ref(
        db,
        `fcmTokens/${user.uid}/${tokenKey(token)}`
      ),
      {
        token,
        createdAt:Date.now(),
        updatedAt:Date.now(),
        userAgent:navigator.userAgent
      }
    );


    await update(
      ref(
        db,
        `rooms/${roomId}/notificationSettings/${user.uid}`
      ),
      {
        enabled:true,
        timezone:"Asia/Taipei",
        updatedAt:Date.now()
      }
    );


    toast(
      "提醒已開啟"
    );


  }catch(error){

    console.error(
      "notification:",
      error
    );


    toast(
      "通知設定失敗："+friendlyError(error)
    );

  }

}

async function leaveRoom(){

  if(
    !user||
    !roomId
  ){

    toast(
      "目前沒有加入房間"
    );

    return;

  }


  if(
    !confirm(
      "確定要離開這個房間嗎？"
    )
  ){

    return;

  }


  const oldRoomId=
    roomId;


  try{

    const memberData=
      room?.members||
      {};


    const memberIds=
      Object.keys(
        memberData
      );


    /*
     * 情況 1：
     * 只有房主自己。
     */

    if(
      memberIds.length===1&&
      memberIds[0]===user.uid
    ){

      await remove(
        ref(
          db,
          `rooms/${oldRoomId}`
        )
      );


      clearListeners();

      room=null;
      roomId="";
      currentDate=new Date();

      localStorage.removeItem(
        "momentlog_room"
      );


      $("room")
        .classList
        .add("hide");

      $("setup")
        .classList
        .remove("hide");


      toast(
        "你是最後一位成員，房間已刪除"
      );


      return;

    }


    /*
     * 情況 2：
     * 房主且有其他人。
     */

    if(
      isOwner()
    ){

      let newOwnerUid=
        memberIds.find(
          uid=>uid!==user.uid
        );


      if(
        !newOwnerUid
      ){

        /*
         * 防止資料異常時卡死。
         * 重新讀一次 members。
         */

        const snapshot=
          await get(
            ref(
              db,
              `rooms/${oldRoomId}/members`
            )
          );


        const freshMembers=
          snapshot.val()||
          {};


        const freshIds=
          Object.keys(
            freshMembers
          );


        newOwnerUid=
          freshIds.find(
            uid=>uid!==user.uid
          );


        if(
          !newOwnerUid
        ){

          /*
           * 真的只剩自己。
           */

          await remove(
            ref(
              db,
              `rooms/${oldRoomId}`
            )
          );


          clearListeners();

          room=null;
          roomId="";
          currentDate=new Date();

          localStorage.removeItem(
            "momentlog_room"
          );


          $("room")
            .classList
            .add("hide");

          $("setup")
            .classList
            .remove("hide");


          toast(
            "你是最後一位成員，房間已刪除"
          );


          return;

        }

      }


      const newOwnerName=
        (
          memberData[newOwnerUid]||
          {}
        ).displayName||
        "新房主";


      /*
       * 一次更新：
       * ownerUid 改成新房主
       * 舊房主 member 移除
       * 舊房主通知設定移除
       */

      await update(
        ref(db),
        {

          [`rooms/${oldRoomId}/meta/ownerUid`]:
            newOwnerUid,

          [`rooms/${oldRoomId}/meta/updatedAt`]:
            Date.now(),

          [`rooms/${oldRoomId}/members/${user.uid}`]:
            null,

          [`rooms/${oldRoomId}/notificationSettings/${user.uid}`]:
            null

        }
      );


      clearListeners();

      room=null;
      roomId="";
      currentDate=new Date();

      localStorage.removeItem(
        "momentlog_room"
      );


      $("room")
        .classList
        .add("hide");

      $("setup")
        .classList
        .remove("hide");


      toast(
        `已離開房間，${newOwnerName} 成為新房主`
      );


      return;

    }


    /*
     * 情況 3：
     * 一般成員。
     */

    await remove(
      ref(
        db,
        `rooms/${oldRoomId}/members/${user.uid}`
      )
    );


    try{

      await remove(
        ref(
          db,
          `rooms/${oldRoomId}/notificationSettings/${user.uid}`
        )
      );

    }catch(error){

      console.warn(
        "notification remove:",
        error
      );

    }


    clearListeners();

    room=null;
    roomId="";
    currentDate=new Date();

    localStorage.removeItem(
      "momentlog_room"
    );


    $("room")
      .classList
      .add("hide");

    $("setup")
      .classList
      .remove("hide");


    toast(
      "已離開房間"
    );


  }catch(error){

    console.error(
      "leaveRoom:",
      error
    );


    toast(
      "離開房間失敗："+friendlyError(error)
    );

  }

}

function changeDate(offset){

  const next=
    addDays(
      currentDate,
      offset
    );


  if(
    next>new Date()
  ){

    return;

  }


  currentDate=
    next;


  lastRenderedHour=
    null;


  loadRecordsListener();

  render();

}


function tick(){

  const now=
    new Date();


  const p=
    taipeiParts(now);


  $("clock").textContent=
    `${p.hour}:${p.minute}:${p.second}`;


  if(
    !room?.meta
  ){

    return;

  }


  if(
    !isToday(
      currentDate
    )
  ){

    $("next").textContent=
      "正在查看歷史紀錄";

    return;

  }


  const currentHour=
    Number(p.hour);


  /*
   * 不顯示目前小時。
   */

  const maxHour=
    currentHour-1;


  /*
   * 跨整點後重新 render。
   */

  if(
    lastRenderedHour!==maxHour
  ){

    lastRenderedHour=
      maxHour;

    render();

  }


  const next=
    new Date(now);


  next.setSeconds(
    0,
    0
  );

  next.setMinutes(
    0,
    0
  );

  next.setHours(
    next.getHours()+1
  );


  const np=
    taipeiParts(next);


  $("next").textContent=
    `下一個紀錄點 ${np.hour}:00`;

}

        .classList
        .remove("show");

    }

  };


window
  .addEventListener(
    "beforeunload",
    clearListeners
  );


applyTheme();


setInterval(
  tick,
  1000
);


onAuthStateChanged(
  auth,
  async currentUser=>{

    user=
      currentUser;


    renderAccount();


    if(!currentUser){

      $("room")
        .classList
        .add("hide");


      $("setup")
        .classList
        .remove("hide");


      clearListeners();

      room=null;
      roomId="";


      showSetupStatus(
        "請先登入 Google 帳號"
      );


      return;

    }


    showSetupStatus(
      "Google 登入成功"
    );


    await loadProfile();


    /*
     * 如果有舊房間：
     * 重新嘗試進入。
     */

    const savedRoom=
      localStorage.getItem(
        "momentlog_room"
      );


    if(savedRoom){

      roomId=
        savedRoom;

      connectRoom();

    }


    initForegroundMessaging();

  }
);

</script>

</body>
</html>
